  mentions-inbox:
    status: partial
    ref: "app/src/components/board/mentions-inbox.tsx (+ mentions-inbox-row.tsx, mentions-inbox-model.ts)"
    notes: >-
      Ships and works, but app/-locked: the row and the list live in app/src
