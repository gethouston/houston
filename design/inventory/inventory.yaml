# Houston cross-surface component inventory
#
# THE CONTRACT
# ------------
# This file is the single source of truth for WHICH product components exist
# across Houston's surfaces and WHAT each one is (anatomy, states, semantics,
# a11y). It handles STRUCTURAL parity only:
#
#   - BEHAVIOR parity  -> owned by the shared SDK view-models (packages/sdk).
#   - LOOK parity      -> owned by design tokens (packages/design-tokens).
#   - STRUCTURE parity -> owned by THIS inventory: does the component exist on
#                         each surface, with the same anatomy/states/semantics?
#
# Every entry here is surface-AGNOSTIC. It describes the component once; each
# surface (web/desktop, iOS, Android) then declares in its own manifest under
# manifests/ whether it implements that component (implemented|partial|
# not-started). scripts/check-parity.mjs (pnpm check:parity) enforces the
# contract in CI: an enforced surface may not lag its declared inventoryVersion.
#
# SCOPE: only components that are genuinely cross-surface (will exist on native
# mobile) belong here. Desktop-only chrome (menu bars, resizable panes, the file
# tree, the schedule/cron editor, skill-authoring dialogs) is deliberately
# excluded -- see design/inventory/README.md for the exclusion rationale.
#
# CHANGE FLOW: add/modify a component -> bump `version` -> add a CHANGELOG.md
# entry -> update every ENFORCED surface manifest in the SAME PR. Unenforced
# surfaces catch up later and bump their manifest's inventoryVersion when they do.
#
# Field reference (all fields required per component):
#   id       kebab-case stable identifier (never reused/renamed without a bump)
#   title    human name
#   purpose  one line: what it is / when it appears
#   anatomy  named structural parts
#   states   distinct render states (incl. loading/empty/error/streaming where real)
#   variants shape/context variants that are the SAME component
#   behavior semantic notes: what the SDK view-model drives (not styling)
#   a11y     roles / labels / focus expectations the surface must honor
#   since    inventory version this component first appeared in

version: 74

components:
  - id: agent-avatar
    title: Agent avatar
    purpose: Identity badge for an agent -- colored helmet glyph, resting vs running.
    anatomy: [glyph, color-fill, running-glow-ring]
    states: [resting, running]
    variants: [sizes-xs-to-xl, channel-source-avatar]
    behavior: >-
      Stored semantic color id resolves to a palette entry (resolveAgentColor);
      running state is driven by the agent's live run status, not local hover.
    a11y: Decorative when paired with a text label; else img role with the agent name as label.
    since: 1

  - id: agent-list-item
    title: Agent list item
    purpose: A single agent row/card in the agent list or sidebar.
    anatomy: [avatar, name, status-chip, unread-or-count-slot, trailing-actions]
    states: [idle, running, needs-you, unread, selected, focused]
    variants: [sidebar-rail-collapsed, list-row, grid-card]
    behavior: >-
      Selection and run status come from the view-model; the row reflects the
      agent's aggregate mission state, not a single conversation. The unread
      state fills the unread-or-count-slot with a small filled action-token dot
      whenever any of that agent's missions has moved, or somebody typed the
      reader's name in one, since the reader last opened it. It renders
      ALONGSIDE the needs-you chip and before it, never instead of it: "there is
      something new here" and "act now" are different claims and must not
      collapse into one mark. It is a dot, never a number -- the count lives in
      the label. Read state is per person and per device, and the signal is
      multiplayer-only, so single player, the desktop app and any signed-out
      surface never paint it and reserve no space for it.
    a11y: >-
      button/listitem role, name as accessible label, aria-current when
      selected; the unread dot is an image-role element carrying a text label
      that states the count ("3 unread updates"), so the signal is never
      colour/shape alone.
    since: 1

  - id: conversation-feed
    title: Conversation feed
    purpose: The scrolling transcript that hosts every message/tool/system item.
    anatomy: [scroll-viewport, load-older-trigger, item-list, stick-to-bottom-anchor, scroll-to-bottom-button]
    states: [empty, loading-history, loading-older, streaming, idle, error]
    variants: [single-player, multiplayer]
    behavior: >-
      Renders an ordered FeedItem stream; auto-sticks to bottom while streaming
      unless the user scrolled up. Item ordering/merge is view-model driven.
      Opens on the transcript's TAIL window (v34): when the view-model reports
      older messages beyond the loaded window, scrolling the top of the feed
      into view fetches and prepends the previous page (quiet spinner while
      loading), anchored so on-screen content never jumps; the trigger retires
      when the window reaches the transcript start.
    a11y: log role with aria-live=polite for appended items; preserves scroll on prepend.
    since: 1

  - id: conversation-map-search
    title: Conversation map search
    purpose: Search and navigate the messages already loaded in an open conversation.
    anatomy: [actions-trigger, actions-menu, find-command, search-field, message-map, back-to-latest-action]
    states: [closed, actions-open, open-unfiltered, filtered, no-results, current-message]
    variants: [conversation-overlay]
    behavior: >-
      The chat header's three-dot menu (left of the people stack and close
      control) offers Find plus status-aware mission actions. Choosing Find
      shows the compact conversation map before a query is entered.
      Filtering is case- and accent-insensitive across every loaded message;
      selecting a result scrolls to and briefly highlights that message. Delete
      remains confirmation-gated.
    a11y: >-
      The icon trigger, menu actions, and close action have accessible labels;
      search is a labeled searchbox; results are buttons in a navigation
      landmark, with aria-current on the message nearest the viewport.
    since: 56

  - id: assistant-message
    title: Assistant message
    purpose: >-
      A model turn's prose -- bare markdown in single player, an incoming
      group-chat bubble in a shared conversation.
    anatomy: [sender-face-column, bubble, sender-name-line, markdown-body, code-block, inline-links, file-chip, copy-action]
    states: [streaming, complete]
    variants: [with-code, plain-prose, single-player, multiplayer-attributed, run-continuation]
    behavior: >-
      assistant_text vs assistant_text_streaming decide whether the body grows
      token-by-token; copy acts on the resolved markdown source. In a SHARED
      conversation (v37) every turn says who spoke; single-player renders no
      sender at all -- bare left-aligned prose, exactly as before. (v40) In the
      shared shape the agent is one more member of the group: its turn sits in
      the same incoming bubble a teammate's does (recessed fill, hairline, 12px
      corners with the top-left squared toward the sender, compact padding),
      its 32px mark top-aligned in the face column, its NAME as the bubble's
      first line, painted in the AGENT'S OWN avatar colour -- chosen per theme
      by MEASURING that colour against the theme's real chat surface (derived
      from the design tokens, dark composited through the glass): a palette
      entry that cannot carry 4.5:1 as text in a theme drops to primary ink in
      that theme, so a later palette edit can never quietly ship an unreadable
      name. All seven agent colours pass in both themes today. Mark and name
      print on the turn that OPENS a run of the agent's turns; a tool/process
      block between two turns is transparent to that rule (it neither starts
      nor breaks a run), while a system divider always breaks one.
      (v54) A WORKSPACE FILE named in the prose is not a link and stops
      dressing as one. Destination kind, not label shape, picks the affordance:
      every file renders as one file chip -- the per-extension glyph in its
      reserved filetype tint on the recessed chip surface, the same mark the
      Files tab and the turn summary use -- whether the agent wrote
      `[Perfil](perfil.md)` or `[plan.md](plan.md)`, which previously split
      across the labeled button pill and the blue autolink chip. No
      external-link arrow: the file opens in-app. Link blue stays reserved for
      the web, so the chip now tells the reader whether a click leaves Houston.
      (v56) The copy action ships as an action row under the settled bubble,
      revealed while the row is hovered OR holds keyboard focus (ChatGPT's
      grammar -- the buttons stay in the DOM and the tab order; a sanctioned
      exception to the no-hover-gating default, owner decision) with a brief
      check-mark confirm; streaming turns carry no actions.
    a11y: article/group role; code blocks keyboard-selectable; copy button labeled. A file chip is a button carrying the file's full path as its title.
    since: 1

  - id: user-message
    title: User message
    purpose: >-
      A message a person sent -- the viewer's own right-aligned, a teammate's
      mirrored to the left with their face beside it.
    anatomy:
      [
        sender-face-column,
        bubble,
        sender-name-line,
        attachment-chips,
        copy-action,
        edit-action,
        inline-editor,
      ]
    states: [default, with-attachments, editable, editing]
    variants: [single-player, own-message, teammate-message, run-continuation]
    behavior: >-
      The message's stored author drives attribution, and in a SHARED
      conversation (v37) it is forced on for EVERY turn -- attribution follows
      the deployment, not the thread's cast. (v40) The anatomy is a group
      chat's: the viewer's OWN message keeps the right-aligned near-ink bubble
      with NO face and NO name, because a group chat labels the people you talk
      to and identifies you by the side you are on; a TEAMMATE's message
      mirrors to the LEFT as a recessed, hairlined bubble (12px corners, the
      top-left squared toward the sender's face, compact padding; the own
      bubble mirrors that geometry when the thread is attributed) with their
      32px face top-aligned in a fixed avatar column beside it and their name
      as the bubble's FIRST LINE, small and semibold in that person's stable
      tone (hashed from their user id, the same tone their avatar wears
      everywhere else). Face and name print
      only on the message that OPENS a run from that sender; the rest of the run
      renders bare with the avatar column still reserved, so consecutive bubbles
      stay lined up under the face. A change of sender starts a run and a system
      divider breaks one. Single-player carries no face, no name and no reserved
      column. Attachment/skill markers are decoded to a clean preview. (v56)
      The viewer's OWN settled plain-text messages carry an edit action under
      the bubble while the conversation is idle, in an action row revealed on
      row hover OR keyboard focus (ChatGPT's grammar; a sanctioned exception
      to the no-hover-gating default, owner decision). Choosing it swaps the
      bubble for an IN-PLACE full-width editor card (the message's text,
      Cancel / Send; Enter sends, Escape cancels; the composer is never
      touched); Send REWINDS the conversation to that message and continues
      from the edited version, earlier turns untouched. Marker messages
      (skill/attachment/interaction answers), channel relays, teammates'
      rows, and pre-turn-id transcripts are not editable. Settled rows on
      either side carry a copy action in the same revealed row (verbatim
      text, brief check-mark confirm); marker-encoded rows are not copyable
      -- their wire encoding is not what the bubble shows.
    a11y: >-
      group role; a teammate's name is visible text inside the bubble, while the
      viewer's own rows carry the consumer's "you" label as screen-reader-only
      text, since alignment is a visual-only cue; attachments labeled.
    since: 1

  - id: thinking-indicator
    title: Thinking / reasoning indicator
    purpose: Signals the model is working -- reasoning block or the pre-token wait.
    anatomy: [helmet-glyph, shimmer-label, collapsible-reasoning-body]
    states: [submitted-waiting, streaming-thoughts, collapsed, expanded]
    variants: [typing-bounce-dots, reasoning-collapsible]
    behavior: >-
      Shown while a turn is in flight with no visible stream (deriveStatus =
      submitted); yields to the stream once tokens appear. Reasoning content is
      thinking / thinking_streaming feed items. The pre-token wait renders as
      the turn-status line itself (one component, one size) playing the rotating
      phrase deck; the deck plays ONLY in this connecting state -- an executing
      agent's header names the concrete task instead (PRODUCT-1226).
    a11y: aria-live=polite status text; expand/collapse is a labeled toggle button.
    since: 1

  - id: tool-call-chip
    title: Tool call chip
    purpose: Collapsible display of one tool invocation and its result.
    anatomy: [tool-icon, action-label, chevron, collapsible-output, result-status]
    states: [running, success, error, collapsed, expanded]
    variants: [default-auto-collapse, bash-collapsed-by-default]
    behavior: >-
      Auto-opens while running, auto-collapses shortly after the result; Bash
      stays collapsed. Label derives from tool name + input via tool-labels.
    a11y: toggle button with tool action as label; error state announced.
    since: 1

  - id: provider-error-card
    title: Provider error card
    purpose: Actionable card for a provider failure in the feed (auth, quota, rate-limit).
    anatomy: [icon-bubble, title, reason, primary-action, secondary-action]
    states: [unauthenticated, quota-exhausted, rate-limited, model-unavailable, context-overflow, transient]
    variants: [single-action-row-card, multi-action-error-card]
    behavior: >-
      provider_error feed items carry a typed ProviderError (cause/scope). The
      card maps each taxonomy variant to its reconnect/upgrade/retry affordance.
    a11y: alert role; each action a labeled button; status-page link where relevant.
    since: 1

  - id: agent-provisioning-card
    title: Agent provisioning card
    purpose: >-
      In-chat notice under a sent message while a just-created agent's hosted
      engine is still warming up, so the wait reads as expected, not broken.
    anatomy: [spinner, title, body]
    states: [default, disabled]
    variants: [chat-card, blocked-write-dialog]
    behavior: >-
      Driven by the client-side provisioning presence map: marked on hosted
      agent create, cleared by a readiness long-poll against the agent's
      engine. The chat-card sits under the user's sent (queued) message; the
      blocked-write-dialog opens when a write is attempted while warming —
      reads stay free (tabs render with empty data). Queued sends deliver on
      ready; both surfaces dismiss themselves.
    a11y: status role; spinner decorative, text carries the message.
    since: 3

  - id: system-message
    title: System message / boundary
    purpose: Non-message feed events -- system notes and context/provider boundaries.
    anatomy: [divider-rule, centered-italic-label]
    states: [system-note, context-compacted, provider-switched]
    variants: [plain-note, divider-boundary]
    behavior: >-
      system_message renders a centered note; context_compacted and
      provider_switched render subtle dividers that keep the full chat visible.
    a11y: separator role for boundaries; note text exposed to the a11y tree.
    since: 1

  - id: skill-invocation-message
    title: Skill invocation message
    purpose: Shows that the user ran a Skill, as a decoded card in the feed.
    anatomy: [skill-image, skill-title, field-summary]
    states: [default]
    variants: [with-image, initial-fallback]
    behavior: >-
      A user-message marker (decodeSkillMessage) is decoded to a structured
      payload so every surface renders the same card instead of the raw marker.
    a11y: group role labeled with the skill name; image is decorative.
    since: 1

  - id: composer
    title: Composer
    purpose: The signature message-input surface -- text, attachments, send/stop.
    anatomy: [leading-attach, textarea, footer-slot, queued-list, trailing-send-stop]
    states: [ready, submitted, streaming, has-attachments, drag-over, disabled, replaced-by-override]
    variants: [single-line, multiline-expanded, phone]
    behavior: >-
      Send is gated on non-empty text/attachments; while streaming the trailing
      button becomes Stop. Queued messages show when sending mid-turn. A host
      surface may pass an override card that renders above the input (default)
      or replaces it outright while present (replaced-by-override) when that
      card is the only intended action, e.g. onboarding's one-button offer.
      The footer slot's pickers (mode, model, effort, context) sit in ONE row
      at both breakpoints. Below the one breakpoint (phone) the row keeps
      only its two named pills (mode, model) plus the effort gauge and the
      context ring; Skills moves into the attach menu; each picker opens as a
      bottom sheet rather than an anchored popover, and the context ring
      opens on tap (a hover card never does on touch). The composer stays
      tight to the keyboard: nothing but the safe area (or the keyboard's own
      inset) sits below its row, and opening a chat never focuses the
      textarea on the phone.
    a11y: labeled textarea; send/stop button state-labeled; drop zone announced; phone pickers are titled dialogs.
    since: 1

  - id: mention-autocomplete
    title: Mention autocomplete
    purpose: The teammate picker the composer raises when the writer types "@" in a shared chat.
    anatomy: [popover-surface, person-row, person-face, person-name]
    states: [closed, open-filtering, open-empty-closes, keyboard-highlighted]
    variants: [pointer-select, keyboard-select]
    behavior: >-
      Opens on an "@" that starts a word and filters the space's co-member
      directory as the writer types (case- and accent-insensitive, self
      excluded). Accepting inserts the plain text "@Name" and records the
      person on the send's structured mention list, so the model reads prose
      while the wire carries identities. Arrow keys move the highlight, Enter
      or Tab accepts, Escape closes. With no roster (single player, personal
      space, or a host without the directory) it never opens and "@" is just
      a character.
    a11y: listbox/option roles; the highlighted option is announced; the textarea keeps focus throughout.
    since: 38

  - id: mention-chip
    title: Mention chip
    purpose: An "@Name" inside a message, rendered as a person pill instead of raw text.
    anatomy: [pill, at-sign, person-name]
    states: [default, self-mention]
    variants: [in-user-bubble, in-agent-prose]
    behavior: >-
      A human message chips the mentions stored on the message itself; agent
      prose is matched against the known people of the space, since an agent
      writes names as plain text. A mention of the reader is emphasized so
      being asked for something stands out. Chips never render inside code.
    a11y: Decorative styling only -- the chip keeps the literal "@Name" text in the reading order.
    since: 38

  - id: turn-status
    title: Turn status line
    purpose: The helmet + muted label line reporting the current turn state.
    anatomy: [helmet-glyph, status-label, shimmer]
    states: [idle, active-shimmer]
    variants: [inline-in-feed, standalone-on-card]
    behavior: >-
      Label + active flag come from deriveStatus over the feed; shimmer marks an
      ongoing/pending state. Inline-safe so it can sit inside markdown prose.
      While the agent executes, the label holds the current task (tool verb /
      integration brand), folding a run of consecutive identical activities
      into one label with an "xN" repeat counter (PRODUCT-1226).
    a11y: status role; label announced politely; shimmer is presentational only.
    since: 1

  - id: progress-panel
    title: Progress panel
    purpose: Agent-declared step checklist for a running mission.
    anatomy: [header-count, step-row, step-status-icon]
    states: [pending, active, done, empty]
    variants: [side-panel, sidebar-card]
    behavior: >-
      Steps come from the agent's update_progress calls (or are derived from
      tool activity); header shows "X of Y complete".
    a11y: list role; each step's status conveyed as text, not color alone.
    since: 1

  - id: approval-surface
    title: Approval / needs-you surface
    purpose: Where a mission awaiting the user is reviewed and approved.
    anatomy: [item-title, status-indicator, deliverable-preview, approve-action, feedback-input]
    states: [needs-you, running, approved, error, empty]
    variants: [list-item, detail-panel]
    behavior: >-
      needs_you items are surfaced for the user to review; approve advances the
      mission, feedback returns it to the agent. Status drives the indicator.
    a11y: needs-you item announced; approve is a labeled primary button; live status.
    since: 1

  - id: interaction-card
    title: Interaction card
    purpose: In-chat surface shown when the agent pauses mid-turn to gather what it needs before continuing; a stepper that walks the user through one step at a time (questions, then sign-in, then connections, then action approvals), replacing the composer while pending.
    anatomy: [modal-shell, modal-header, step-title, step-title-icon, pager, collapse-chevron, dismiss-action, bounded-scroll-body, option-row, number-badge, recommended-chip, selected-arrow, free-text-escape-field, pencil-adornment, footer-row, unified-decline, decline-esc-hint, step-cta, return-key-glyph, trailing-free-text-row, app-logo, integration-name, reason-line, explainer-line, connected-check, waiting-note]
    states: [single-step, multi-step, collapsed, with-options, single-option, recommended-option, free-text-only, signin-step, connect-step, connecting, connected, skipped, revisited, reconsider, abandoned, disabled]
    variants: [choice, open-ended, signin, connect, mixed-sequence]
    behavior: >-
      Rendered from the turn's pending interaction (steps[]: 1-3 question steps,
      then at most one signin step, then connect steps, then approval steps —
      approvals land LAST, since approving an action happens after its toolkit is
      connected; the approval step's body is its own component,
      interaction-approval-card, injected via a `renderApproval` prop the way
      signin/connect bodies are). Every step is composed in
      ONE shared modal shell (InteractionModal) that owns the chrome — a white
      card with a hairline border and roomy padding (the reference "Coworker card"
      look; a card-surface same colour as the page, set apart by border + soft
      shadow, theme-aware tokens keep dark mode sane), a HEADER row, a body that
      fades on step swap, and a right-aligned FOOTER row. Only its body is bounded
      to 40vh and scrolls; the footer and trailing free-text row stay fixed. A
      visible-at-rest header chevron collapses it to the title, pager, muted
      one-line step hint, and expand control without muting the blocked state;
      the chevron remains usable while the rest of the card is disabled, so the question
      stepper, the sign-in step, and the connect step are structurally identical
      and differ only in the title / body / footer nodes they hand in. Shows ONE
      step at a time. Weight is restrained across the whole family: color tone
      (foreground vs muted) carries the hierarchy — the modal title and the option
      / identity labels are REGULAR weight, never bold; the only font-medium left
      is the Recommended chip, the number badge digit, and the filled CTA label.
      Header: the step TITLE left (a question's text, or a signin/connect step's
      '(icon) ACTION' identity lockup — the real brand logo beside the explicit
      connect action, "Connect Google Sheets" (or the integration NAME,
      "Houston", for sign-in) with, top-RIGHT on the same row, a
      compact "N of M" pager whose chevrons ARE the Back/Forward navigation
      (hidden for a single-step sequence) plus a dismiss X that abandons the WHOLE
      sequence. This '(icon) ACTION/NAME' header title is the family convention for ANY
      card carrying an app/brand icon (the action-approval card adopts it too;
      suggest-reusable and plan-ready have no app icon and keep their own
      headers). The card replaces the composer while the sequence is pending;
      dismissing restores it. Dismissing (the X) is a user
      INTERRUPTION, not an answer: it persists a durable `stopped` marker on the
      turn AND clears the pending interaction, so the sequence retires and the
      MODEL LEARNS NOTHING from the abandonment (a reload renders the standard
      "Stopped by user" line, never the card again — live and reload settle
      identically); the mid-turn race is refused (409). Question step: single-select option rows (role=radio)
      each carry a LEFT circular number badge (the digit is the keyboard shortcut
      — pressing it selects the row whenever focus is not in a text field), a
      regular-weight label, and an optional soft "Recommended" chip (at most one
      option). The option's wire `description` is TOLERATED but NOT rendered — the
      label + chip say enough. The row surface is transparent until hover/selected,
      when it fills a soft grey and reveals a trailing arrow; clicking answers and
      advances. Below the option rows is the free-text ESCAPE FIELD — an honest
      input: a hairline field border (the design system's border-input/bg-transparent
      vocabulary, shared with the composer and every Input), a text cursor over its
      whole surface, and a border-ring focus state, so its resting look promises
      the text input it becomes. A pencil adornment sits at left and a placeholder
      ("None of these..." when options are present, else a neutral answer prompt);
      clicking anywhere in the field focuses it, typing expands it and Enter
      submits. The card-wide decline is NOT in this field — it lives in the
      FOOTER. Every step kind shares ONE unified decline word ("Not now") + Esc
      keycap hint in the footer: a question's footer is that decline ALONE (no
      primary CTA — clicking an option is the advance), while a signin/connect
      footer places it beside the single filled CTA pill ("Connect" / "Sign in",
      with a return-key glyph). The connect, sign-in, and credential free-text
      alternate-instruction row follows that footer, keeping the required action
      above the redirect path. Skip/decline advances past ANY step kind without
      completing it — a skipped question is omitted from the composed reply, while
      a skipped signin/connect is a recorded fact the reply states ("Skipped
      connecting {app}." / "Skipped signing in.") so the agent hears the decline
      instead of re-requesting. Esc declines on every kind (Enter also fires the
      CTA on signin/connect); a capture-phase handler pre-empts the global
      Escape-closes-the-panel shortcut when it acts, and yields to the composer
      while a field has focus. Navigation is the header pager for every kind, so
      the body carries no nav button: ui/chat (auth/Composio-unaware) owns the
      shell, the pager, and the callbacks (StepFooterApi { revisited, onSkip } +
      StepChrome { pager, onDismiss, dismissLabel, disabled }); the app owns the
      reactive signin/connect body + CTA, rendering its own InteractionModal wired
      with that chrome. While an OAuth hand-off is in flight the CTA shows a
      connecting spinner and a quiet muted line reminds the user their browser is
      waiting; an already-connected app swaps its reason body for a calm check
      + "Connected" and self-reports to advance (live frontier only). "Not now"
      travels WITH the CTA: the decline affordance is present wherever the CTA is
      (frontier AND a reconsidered skip), so no step is ever a dead end with only
      a Connect/Sign in button. Revisiting an already-reached signin/connect step
      (walked back via the pager) splits by its FINAL state: a COMPLETED step
      shows the calm connected/signed-in state with NO footer (the pager's forward
      chevron is the only way onward, since its card cannot re-fire completion); a
      SKIPPED step is still actionable, so its CTA (and its paired "Not now")
      return — letting the user RECONSIDER and connect / sign in after all, or
      decline again (the pager forward "keeps it skipped"). Revisiting a question
      pre-selects its prior answer (soft-grey fill); re-answering replaces it. A
      single question-with-options step keeps the one-tap feel (click = answer =
      complete). After the last step, emits each answered question in step order;
      the consumer encodes the structured interaction-answers message, appending
      the signed-in/connected status lines and the skipped-step facts derived
      from each step's FINAL outcome — a step skipped then reconsidered reports
      "Connected {app}." (never a stale "Skipped connecting {app}."), and no step
      is named twice. Disabled while another turn is active.
    a11y: one step announced at a time, its question read as the modal title; option rows are role=radio in a radiogroup, keyboard-selectable by the left number badge's position digit and visible at rest (no hover gate), showing label + optional Recommended chip only (no description); the free-text escape field (a bordered text input with a leading pencil adornment, no embedded control) is always present on question steps and follows the fixed footer on signin/connect/credential steps; the pager's Back/Forward chevrons, collapse chevron, and dismiss X are labeled icon buttons; collapsed cards retain one muted, truncated context line; the footer's unified decline is a labeled button with an Esc keycap hint on every kind, and signin/connect add a labeled filled CTA (Enter fires it, Esc declines). While collapsed, step shortcuts are inert; while a turn runs, every action except the collapse chevron is disabled. The "N of M" pager copy is visible text.
    since: 4

  - id: interaction-approval-card
    title: Interaction approval card
    purpose: The approval STEP inside the interaction stepper, shown when an integration action needs the user's go-ahead before it runs; asks "Allow {app} to {action}?" and records allow-once / always-allow / deny.
    anatomy: [app-logo, integration-name, permission-question, decided-state, footer-row, always-allow, deny, allow-once, return-key-glyph, decline-esc-hint]
    states: [frontier, decided-allowed, decided-denied, revisited, disabled]
    variants: [approval]
    behavior: >-
      An `approval` step (protocol `InteractionStep` kind=approval: `{toolkit,
      action, params, paramsHash}`) rides the SAME shared InteractionModal shell
      as the signin/connect steps (member of the interaction-card family,
      inventory v20). The host mints it: the sandbox execute route gates an
      integration `execute` and answers 409 `approval_required` with a
      display-ready payload; the runtime records the step on the turn holder
      (`recordApproval`, deduped by paramsHash, ids a1..aN, approvals LAST) and
      returns queued-pending text rather than an error. The app supplies the body
      via ui/chat's `renderApproval` prop (ui/chat stays Composio-unaware, exactly
      like renderConnect/renderSignin). The modal TITLE is the '(icon) NAME'
      identity lockup (real brand logo beside the integration name, REGULAR
      weight); the body is deliberately NON-technical (v27): JUST the permission
      question in foreground tone ("Allow {app} to {action}?") — the tool's raw
      params are received on the wire but NEVER rendered (the target user is
      non-technical; the approval still covers the exact call via paramsHash).
      THREE decisions from the FOOTER: Always allow
      (outline, pushed LEFT), Deny (outline, Esc), Allow once (filled, Enter,
      return-key glyph). Unlike a connect/signin "Not now" (which merely defers),
      Deny is a real decision the model is TOLD about: resolution writes the store
      (allow-once → a one-shot ticket POST keyed by paramsHash; always-allow →
      the always-allow POST) then advances, and the composed reply names the RAW
      action slug ("Approved: go ahead with {ACTION}." / "I chose not to allow
      {ACTION}. Do not retry it; continue without it.") so the model can re-issue
      the EXACT call. Enter=allow-once / Esc=deny run capture-phase and are inert
      while a text field has focus (the real composer keeps its keys) and once the
      step is decided or disabled. The header X is NOT a Deny — it interrupts the
      WHOLE sequence (see interaction-card's dismiss semantics). A REVISITED
      already-decided step shows the calm decided state (check + "Allowed", or a
      muted "Denied") with NO footer; the pager's forward chevron is onward.
      Autopilot AUTO-APPROVES the gate (the runtime forwards `x-houston-turn-mode:
      auto`), so this card never appears on an auto turn.
    a11y: the permission question reads as the prominent line under the app-identity title; the three decisions are labeled footer buttons (Deny carries an Esc keycap hint, Allow once a return-key glyph); a revisited decided step exposes its outcome as text (no color-only), no footer.
    since: 21

  - id: plan-ready-card
    title: Plan-ready card
    purpose: In-chat surface shown when the agent finishes planning (plan mode) and calls plan_ready; presents an optional compact approval lede and two ways forward, while the complete plan remains in the transcript.
    anatomy: [modal-shell, title, collapse-chevron, dismiss-x, optional-clamped-plan-lede, coworker-row, autopilot-row, trailing-feedback-row]
    states: [default, collapsed, disabled]
    variants: [default]
    behavior: >-
      Rendered from a pending interaction carrying a single plan_ready step
      (summary), exactly like ask_user reaches the frontend. The complete plan
      is the assistant's preceding transcript message; a non-empty summary
      clamps to two lines as a lede above two always-visible option rows built in the composer mode
      menu's idiom: each a full-width row with its icon inline with the title
      (Handshake / Rocket, matching the mode selector) and a
      one-line description below, rounded-xl hover background, nothing
      hover-gated. "Continue in Coworker mode" starts a normal (execute) turn
      confirming the plan; "Continue in Autopilot mode" starts an autopilot
      (auto) turn; both flip the composer Mode pill to match and send a visible
      user message. The header dismiss X dismisses the card LOCALLY (the composer
      returns, mode stays plan) without sending; a later, different plan
      re-shows the card. Primary emphasis comes from row order + title weight,
      not a filled button. The shared InteractionModal shell bounds the expanded
      body to 40vh with scrolling and has a visible-at-rest chevron that collapses
      the card to its title, optional muted summary hint, and expand control. An
      empty backstop summary renders no lede or collapsed hint, leaving the
      title to carry the collapsed state. Its fixed
      trailing feedback row is the only text input on screen, labeled "Give feedback on the plan...": typing an
      instruction sends a visible plan-mode user follow-up and retires the card.
      Disabled gates the rows and free-text input while the chevron remains
      available for reading the transcript.
    a11y: title, then the clamped plan lede when a summary is present, read in order; the labeled collapse and expand controls plus labeled dismiss X are visible at rest; two labeled row buttons and the shared feedback input are keyboard-reachable; each row has a foreground-color icon inline with its title; disabled state marks the surface aria-disabled and gates every action.
    since: 9

  - id: suggest-reusable-card
    title: Suggest-reusable card
    purpose: In-chat offer shown when the agent finishes a mission cleanly and, in its end-of-task reflection step, calls suggest_reusable; proposes saving the just-completed work as a reusable Skill, a scheduled Routine, or a Learning to remember, floating above the always-mounted composer.
    anatomy: [eyebrow, proposed-title, rationale, save-row, not-now-row]
    states: [default, disabled]
    variants: [skill, routine, learning]
    behavior: >-
      Rendered from a pending interaction carrying a single suggest_reusable
      step (reusableKind, title, rationale) on the terminal done frame. Unlike
      every other interaction step, a lone suggest_reusable step keeps the
      mission's board status at done (the offer is optional, nothing is
      waiting). Shows the eyebrow, the model-proposed name prominently, and the
      model's one-line rationale, then two full-width rows in the plan-ready
      card's idiom: Save (Sparkles icon for a Skill, CalendarClock for a
      Routine, Lightbulb for a Learning; label names the kind) sends a
      follow-up message asking the agent to actually write the
      Skill/Routine/Learning, always as an execute turn regardless of the
      composer's pinned mode, dismissing the offer locally first; "Not now"
      dismisses locally. Typing in the composer instead abandons it like any
      interaction card. Dismissal is per-offer (step id) and per conversation.
    a11y: eyebrow then title then rationale read in order; two labeled row buttons visible at rest (no hover gate), keyboard-reachable; disabled marks the surface aria-disabled and gates both rows.
    since: 12

  - id: suggest-actions
    title: Suggested action bubbles
    purpose: Optional clickable next steps shown above the composer after a mission finishes cleanly.
    anatomy: [heading, horizontal-pill-scroller, dismiss]
    states: [default]
    variants: [actions-only, actions-with-reusable]
    behavior: >-
      A suggest_actions interaction step carries two to four concrete actions,
      each with a short label and the visible user message sent on click. It
      rides the terminal done frame and keeps the mission done, never
      needs_you. Dismiss hides the bubbles and clears the persisted offer;
      clicking an action starts its follow-up turn. It may appear before the
      optional suggest-reusable card on the same clean-finish frame.
    a11y: heading and all pill buttons are visible at rest, keyboard reachable, and the dismiss control has an accessible label.
    since: 43

  - id: chat-mission-list
    title: Child mission drawer
    purpose: The missions a chat started, in a collapsible drawer above its composer so a coordinating mission is also its own monitor.
    anatomy: [title-toggle, count, toggle-chevron, mission-row, status-dot, status-label, open-chevron]
    states: [open, collapsed, scrolling]
    variants: [alone, above-suggest-reusable]
    behavior: >-
      A mission the agent started with start_mission carries the parent chat's
      conversation id, so the parent lists its children with each one's live
      board status (running, awaiting review, done). Rows are controls: opening
      one selects that mission's own chat, exactly as clicking its board card
      would. The list stands in for the suggested-action bubbles on the same
      clean-finish frame, since reviewing what the chat started is the concrete
      next step; a blocking interaction still wins the composer. The drawer is
      open by default and its title toggles it: collapsed, only the title row
      with the count remains. Archived children drop off as they do on the
      board, and the open list is bounded so a wide fan-out scrolls instead of
      pushing the composer away.
    a11y: the title toggle carries aria-expanded/aria-controls; every row is a button with a visible label and status at rest, keyboard reachable with a visible focus ring; the status dot is decorative and its meaning is duplicated in text.
    since: 59

  - id: chat-parent-mission-link
    title: Parent mission link
    purpose: On a mission the agent started, one bar above the composer linking back to the chat that started it.
    anatomy: [back-glyph, label, parent-title]
    states: [default]
    variants: [with-title, label-only]
    behavior: >-
      The child-side twin of the child-mission drawer, and mutually exclusive
      with it (spawned missions cannot spawn). Rendered only when the open
      chat carries the agent-started origin marker AND the parent mission is
      still on the active board — an archived or deleted parent renders
      nothing, never a dead link. Opening it selects the parent mission's own
      chat, exactly as clicking its board card would. A blocking interaction
      still wins the composer slot.
    a11y: a single button with a visible text label at rest, keyboard reachable with a visible focus ring; the glyph is decorative.
    since: 61

  - id: interaction-answers-message
    title: Interaction answers message
    purpose: The structured user-message bubble a completed question sequence sends; shows each question with its answer instead of a flat "question - answer" text blob.
    anatomy: [bubble-frame, question-line, answer-line, pair-divider]
    states: [default, single-pair]
    variants: [questions-only, mixed-with-confirmations]
    behavior: >-
      A completed interaction card encodes its answers as a marker-prefixed
      user message (houston:interaction-answers) whose plain-text body is what
      the model reads, byte-identical to the pre-existing flat reply. The
      renderer decodes the marker and shows an ordered receipt inside one
      user-side bubble: each answered question as a small muted label with the
      user's answer directly below, successive pairs separated by a hairline
      divider for an even rhythm (a lone pair renders as a compact receipt
      with no divider); confirmation lines with no question (a connected app,
      a sign-in) render as a lone value line. Skipped questions emit no line.
      Malformed or empty payloads fall through to the plain-text bubble;
      connect/signin-only sequences stay hidden auto-continue messages and
      never render this bubble. Deliberately quieter than the interaction
      card, matching the user-bubble family.
    a11y: reads in document order as question-then-answer pairs; pass-through content only, no interactive elements, no hover-gated information.
    since: 12

  - id: deliverable-card
    title: Deliverable card
    purpose: A rendered mission deliverable (markdown output) for review.
    anatomy: [card-frame, markdown-body]
    states: [default]
    variants: [deliverable, user-feedback-bubble]
    behavior: Renders the deliverable markdown; feedback variant echoes the user's reply.
    a11y: article role; headings preserved from source markdown.
    since: 1

  - id: mission-card
    title: Mission card
    purpose: A board card representing one mission/conversation.
    anatomy:
      [
        avatar,
        title,
        status-chip,
        actions,
        drag-handle,
        select-checkbox,
        people-face-stack,
        people-overflow-chip,
      ]
    states:
      [
        resting,
        running,
        needs-you,
        error,
        selected,
        focused,
        dragging,
        attributed,
      ]
    variants: [board-card, archived-list-row]
    behavior: >-
      Running state shows the comet glow. The card carries at most ONE
      status-gated primary action, decided by the column it sits in and offered
      at full resting weight (never hover-gated): a Needs-you card gets the
      checkmark that moves it to done, a Done card gets the box that archives
      it. The two status sets are disjoint, so the pair never competes for the
      same card, and a running card offers neither -- nothing to sign off yet,
      nothing to file away. Archiving takes the mission off the active board
      (it is the only status with no column), so a card archived while its chat
      is open closes that panel, exactly as a delete or a bulk archive does; it
      is not destructive and never celebrates. Drag/multi-select
      are surface-capability gated (pointer drag on desktop). The people face stack
      is the multi-contributor signal: every human on the mission, creator first,
      as overlapping ringed avatars over the card body's bottom-right corner
      (photo when known, otherwise initials on an opaque desaturated person tone
      picked deterministically from the person's id, so one person keeps one tone
      everywhere). Past five faces the rest collapse into a solid "+N" chip that
      expands to the full roster, and the card body reserves a right gutter sized
      to the stack so no text ever runs underneath it. Server-stamped attribution
      only (multiplayer); an unattributed card renders exactly as before.
    a11y: >-
      article/button role; title as label; checkbox labeled; status not
      color-only; each action button is a >=24px hit box whose icon-only glyph
      carries an accessible label naming what it does, so approve and archive
      are told apart by name, not shape; the face stack is a labeled group, each face names its person
      (tooltip + title) and the "+N" chip is a labeled control, so no contributor
      is reachable by hover alone.
    since: 1

  - id: mission-board
    title: Mission board
    purpose: The columned board that groups mission cards by status.
    anatomy:
      [
        column,
        column-header,
        card-list,
        empty-column-state,
        bulk-action-bar,
        mentions-pill,
        segmented-pager,
        mobile-control-row,
      ]
    states: [populated, empty, loading, dragging]
    variants: [multi-column-board, single-column-list, phone-pager]
    behavior: >-
      Columns map to mission statuses; cards move between columns on approve/drag.
      Bulk-action bar appears when cards are multi-selected.
      The mentions pill is the toolbar control that swaps the board for the
      mentions-inbox mode: an at-sign pill sitting beside the archived pill,
      highlighted while that mode is showing, collapsing to its icon alone when
      a chat panel narrows the board, and carrying the number of outstanding
      mentions -- a mention of the reader newer than their read cursor, not
      ambient mission movement -- clamped to "99+". Multiplayer only: single
      player gets no mentions chrome at all.
      Below the one breakpoint the SAME board is a pager, not a squeezed
      kanban: each column is one full-width page the user swipes between, a
      segmented control above the pages names the three sections with their
      live counts and stays in sync both ways (swiping moves the highlight,
      tapping a segment scrolls its page in), and a page with no cards says so
      in words instead of standing hollow. The pager is the ONE place a
      section is named on the phone: a page draws no column header of its
      own, sits flat on the screen rather than in a tinted column, and the
      Running page LEADS with the board's "+" (above its cards or its empty
      hint, never under them) -- on the phone that "+" composes the phone
      way, a pushed draft chat scoped to the board's agents. Above the pages
      sits the phone's own control row: the search field, the section's
      archived toggle, and -- when the board spans several agents -- an agent
      filter bar defaulting to "All agents" that reads and writes the same
      agent pin the desktop breadcrumb does. The control row carries no
      compose of its own: the shell top bar's compose and the page's "+" are
      the phone's two. Tapping a card on the phone pushes the
      mission-chat-screen instead of opening the side panel.
    a11y: >-
      list/grid semantics per column; column headers labeled; DnD has
      non-pointer fallback; the mentions pill names its mode and repeats its
      outstanding count in its accessible name, so the number is never
      visual-only. Phone pager segments are real buttons carrying aria-current
      on the active page and the page's count in text, never color alone; the
      agent filter chips carry aria-pressed.
    since: 1

  - id: mentions-inbox
    title: Mentions inbox
    purpose: >-
      Mission Control's multiplayer-only mode listing every mission where a
      teammate typed the reader's name.
    anatomy:
      [
        row-list,
        mention-row,
        unread-dot,
        mentioner-face,
        mission-title,
        mentioner-line,
        relative-time,
        empty-state,
      ]
    states: [loading, populated, empty, unread-row]
    variants: [with-mentioner-face, unattributed-mention]
    behavior: >-
      A plain scrollable list, deliberately NOT a board: there are no columns to
      move a mention between and no status to read off one, only who pinged the
      reader, where, and how long ago. One row per mission that mentions the
      reader, newest mention first, with a deterministic tiebreak so the list
      never reshuffles under a click. A row carries the mentioner's face, the
      line "<Name> mentioned you in <Agent>", the mission title and the age of
      the mention; opening it navigates to that mission's chat exactly as a
      completion notification does. A mention whose author is unknown drops the
      face for an at-sign glyph and says only that the reader was mentioned. A
      row with something new since the reader last opened that mission carries
      the same quiet action-token dot the agent sidebar uses, on a rail that is
      always reserved so read and unread rows stay aligned. With
      nobody mentioning the reader the list shows its empty state; with nobody
      signed in there is no "me" to mention, and the mode is never routed to.
    a11y: >-
      list/listitem semantics; each row is a button whose accessible name is its
      visible text (mission title, the "mentioned you in" line, the relative
      time); the mentioner's name is that text, never the face alone, which is
      decorative; the unread dot is presentational, since a row's presence in
      the inbox is already the claim on attention.
    since: 39

  - id: mission-status-chip
    title: Mission status chip
    purpose: The shared status token (running / needs-you / done / error) used across surfaces.
    anatomy: [status-dot-or-icon, status-label]
    states: [running, needs-you, done, error, cancelled]
    variants: [dot-only, dot-with-label, badge]
    behavior: >-
      One canonical mapping from a mission RunStatus to indicator + label, reused
      by board cards, the approval list, and conversation rows.
    a11y: status conveyed as text/label, never color alone; running is announced.
    since: 1

  - id: routine-row
    title: Routine row
    purpose: >-
      A routine in the routines list -- schedule summary + next run (cron), or
      event summary + trigger status (event-driven).
    anatomy:
      [
        status-icon,
        name,
        schedule-or-event-summary,
        trigger-status-badge,
        next-fire,
        enabled-toggle,
        quick-actions-menu,
        owner-chip,
        connection-warning-chip,
      ]
    states:
      [
        enabled,
        disabled,
        running,
        paused,
        last-run-failed,
        renaming,
        trigger-active,
        trigger-pending,
        trigger-paused,
        trigger-error,
        provider-unusable,
      ]
    variants:
      [list-row, grid-card, schedule-driven, event-driven, cross-agent]
    behavior: >-
      Shows a humanized schedule summary + next fire time (cron routine) or a
      humanized event summary + live provisioning status badge (event-driven:
      active / pending / paused-disconnected / paused-revoked / error, with a
      one-click reconnect on a disconnected account). The toggle enables/disables
      the routine; the leading status icon reflects the live run state. The
      quick-actions menu renames inline and deletes behind a confirm dialog.
      The inline edit panel authors the wake mechanism: where the deployment
      supports event triggers it offers a plain-language "When should this
      happen?" choice (schedule / app event); otherwise it is schedule-only.
      In a CROSS-AGENT list (a team's Routines) the row carries an owner chip
      beside its name -- the owning agent's avatar + name, supplied by the
      surface. The chip never truncates; the routine's name does. A DRAFT row (a
      routine still being built in chat) wears the same chip, or several
      identical "being created" rows would be indistinguishable. A single-agent
      list omits both, since every row would name the same owner.
      A row also carries a WARNING chip when the AI account the routine would
      run on is unusable -- not connected, needing a reconnect, or out of
      credits -- so a broken automation is visible in the list rather than only
      after it fails. The chip is supplied by the surface (the library owns no
      provider state) and is absent for a healthy account, for an unconfirmed
      probe, and for a routine created by someone else, whose account the viewer
      cannot answer for.
    a11y: >-
      listitem role; toggle labeled with the routine name; next-run/status as
      text; status never color-alone (icon shape + row text carry it); menu
      trigger always visible with an accessible label.
    since: 1

  - id: routine-details
    title: Routine screen
    purpose: >-
      A routine's own page (PRODUCT-1208), REPLACING the routines list in the
      main content when its row is clicked -- never a side panel, never a
      popover: the routine's name, an editable description (the prompt IS what
      the routine does), an editable run frequency, the model it runs on, and
      its execution history behind a Runs modal, n8n-style.
    anatomy:
      [
        back-action,
        title,
        runs-action,
        open-chat-action,
        editable-prompt,
        schedule-editor,
        model-row,
        connection-health-badge,
        runs-modal,
      ]
    states:
      [
        viewing,
        editing-prompt,
        editing-schedule,
        loading-runs,
        no-runs-yet,
        provider-connected,
        provider-unusable,
        provider-checking,
      ]
    variants: [full-screen]
    behavior: >-
      The row click lands here (never straight in a chat); Back or Escape
      returns to the list. The description is the prompt in a plain textarea
      -- Save/Cancel appear when edited and Save persists it. The frequency
      shows the humanized cron with the SAME schedule-builder editor the rows
      use (plus the next fire time), or a trigger's plain-language event with
      its live activation chip (event bindings change via chat, not here).
      The model row ALWAYS names the resolved pair -- provider + model, e.g.
      "Claude - Opus 5" -- whether the routine is pinned or follows the agent;
      an unpinned routine adds a quiet line saying so. Picking pins it (the fire
      path honors the pin), a reset row returns to following the agent --
      clamped to the agent's allowed-models ceiling in Teams. Beside it, a
      status badge says whether that AI account is usable BEFORE any run
      (connected / not connected / needs reconnect / out of credits /
      checking), with an inline connect action on the two states connecting can
      fix. The badge is only shown for a routine the viewer created: a fired
      routine runs on its CREATOR's account, and the viewer's own connection
      answer describes a different one -- a routine someone else created gets a
      plain line saying it runs on the creator's account instead. "Runs" opens the execution history as a MODAL: every recorded
      run newest-first with its plain-language outcome (running / done /
      nothing to report / failed / stopped), date + time, elapsed time, and
      -- when the run wasn't silent -- the result it left behind, or, for a run
      that never reached the agent, the reason its AI account could not run it;
      clicking an entry closes the modal and opens that run's chat in the shell panel
      (closing the chat returns to this screen). "Open chat" reaches the
      routine's setup chat the same way.
    a11y: >-
      the screen title and sections are real headings; the prompt textarea is
      labeled; run rows are buttons whose accessible name carries the outcome,
      stamp, and the open-chat action; outcomes are conveyed as text, never
      color alone; the running state is announced by its label, not only the
      spinner.
    since: 58

  - id: skill-row
    title: Skill row
    purpose: A skill in the Skills surface, chat picker, or community catalog.
    anatomy: [icon, name, description, install-or-check]
    states: [available, installed, installing, error, editing]
    variants: [installed-row, picker-select-row, community-catalog-row]
    behavior: >-
      Community rows ride the shared catalog grammar (CatalogRow): the row
      opens the skill's info modal from anywhere on it, a ghost round + installs
      (spinner while in flight, a quiet check once installed). Installed skills are the same
      CatalogRow grammar in the consolidated strip above the Store / Custom
      skills tabs (CatalogShell), capped to a preview behind a "Show all"
      expander at rest; a row opens the edit modal, whose footer carries
      Save/Cancel and the destructive Delete (confirm-gated). The chat picker
      uses the same installed row renderer with search and title-sorted rows;
      selecting a row places that skill in the composer. No separate
      skill-detail surface.
    a11y: rows are single labeled buttons beside a labeled install button, never nested; install state conveyed as text.
    since: 1

  - id: empty-state
    title: Empty state
    purpose: The shared "nothing here yet" surface -- title, description, optional action.
    anatomy: [title, description, optional-action]
    states: [default]
    variants: [with-action, text-only]
    behavior: Big title + description with one optional primary action; no icon-in-box.
    a11y: region labeled by the title; action is a labeled button.
    since: 1

  - id: toast
    title: Toast / notice
    purpose: Transient surfacing of an action's result or error (with report-bug affordance).
    anatomy: [message, optional-action, dismiss]
    states: [info, success, error, loading]
    variants: [plain, with-report-bug-action]
    behavior: >-
      Every user-initiated error must reach a toast carrying the real reason and
      a Report-bug action (beta no-silent-failure policy).
    a11y: status/alert role by severity; auto-dismiss pauses on focus/hover.
    since: 1

  - id: ai-provider-card
    title: AI provider row
    purpose: One AI provider in a browse surface (the AI models hub or a connect flow).
    anatomy: [brand-mark, name, model-count-and-cost-line, trailing-action]
    states: [available, connected, connecting, signing-out]
    variants: [hub-catalog-row, connect-flow-card]
    behavior: >-
      Connection state (connected / in-flight) comes from the shared
      provider-connections layer; the model count is derived from the hub
      catalog across the row's gateway ids. The hub-catalog-row variant is the
      shared catalog grammar (CatalogRow): the WHOLE row opens the provider
      detail modal — every tier of it, including the connected row's usage
      meters — a ghost round + connects (a Cancel pill while that connect
      is in flight), and connected providers leave the grid for the
      consolidated Connected strip above the tabs (CatalogShell), capped to a
      preview behind a "Show all" expander at rest. There the same CatalogRow
      renders as a CARD (surface="card"): because it carries a second tier of
      live detail and opens the account, it paints its surface and hairline ring
      at REST -- pressability is never discovered by hovering -- answers a press
      with a scale, and drops the trailing chevron, which is list-row language.
      The connect-flow-card variant (onboarding / migration / workspace setup)
      keeps the static card with a trailing Connect / Sign out action; nothing
      hover-only in any variant.
    a11y: two sibling buttons, never nested (row body + labeled install); the row's click target is the whole card but its ONE focusable element is the body button, so the card is reached once by keyboard and its name never picks up the extra tiers; on the card surface the focus ring is drawn around the WHOLE card (keyed on that button's focus-visible) so the indicator matches the target it describes; Connect/+ carries the provider name; connected shown as dot + label or a labeled row, not color alone.
    since: 2

  - id: ai-model-row
    title: AI model row
    purpose: One model in the AI hub directory or a provider's model list.
    anatomy: [lab-glyph, name, lab-name]
    states: [default]
    variants: [directory-grid-row, provider-modal-list-row]
    behavior: >-
      A unique cross-provider catalog model in the shared catalog grammar
      (CatalogRow): transparent at rest, the hover fill sweeping the full row.
      The whole row is one button that opens the model detail modal (models
      install via a provider offer inside it, so the row carries no +). The
      directory renders the responsive two-column CatalogGrid; the provider
      modal keeps a single column. The directory sits under a control row of the
      AI provider / Good at / Cost / Memory facet comboboxes alone (free-text
      search is the AI hub's ONE page-level field, threaded in as the query); the
      provider modal keeps its own local search box above the same facets.
    a11y: single button role; model name + lab as the accessible label; no nested buttons.
    since: 2

  - id: connected-provider-usage
    title: Connected provider card usage
    purpose: One connected AI account's live limits, on the account's own card.
    anatomy: [plan-chip, window-meters, credits-line, metered-tokens-line]
    states: [unconfirmed, loading, ok, unsupported, unauthenticated, error]
    variants: [rate-limit-windows, credit-balance, metered-tokens]
    behavior: >-
      Extends the connected provider card (AI models hub) rather than living on a
      screen of its own: the plan chip sits at the card's trailing edge and the
      meters span the card's full width, from the brand mark's left edge to the
      card's right edge (never indented to the text column, which reads as a
      paragraph hanging off a row), INSIDE the card's own hover/focus surface AND
      its click target, so an account and how much of it is left read
      as one thing: one wash covers both, and a click on the meters opens the
      same provider detail the card does. Paired from the engine's per-account usage rows
      (GET /providers/usage — each provider's own usage API read with the
      already-linked credential). The rate-limit-windows variant renders a
      labeled meter per rolling window (percent used + localized reset note; the
      bar tints warning at >= 90%); credit-balance shows the remaining prepaid
      balance; metered-tokens shows Houston's own token count for providers with
      no usage API. Non-ok rows say so honestly (no usage surface / sign in again
      / the probe's error) instead of faking an empty meter. A row whose
      connection is only unconfirmed shows NO usage tier at all: an account
      Houston cannot read gets no metering claim, not even "not measured yet",
      and the fetch itself is gated on at least one CONFIRMED account. A loaded
      row is sized by its content: it ends one padding step after its last
      meter, never at a reserved height, so an account with a single window
      leaves no dead band under it. Stillness comes from ONE pre-data frame
      drawn in the most common account's shape (two window bars) plus readings
      that are retained across background refetches, so the only resize a row
      can make is the single settle onto its first reading, and the plan chip's
      slot is held open meanwhile so nothing reflows sideways. Rows refresh on a
      slow interval (the hub is a browse surface, not a monitor), on window
      focus, and on the provider connect event; a failed background refetch
      keeps the last good readings rather than blanking them.
    a11y: >-
      Informative content outside the row BUTTON (the meters below it, the plan
      chip beside it), so the button's accessible name stays the provider name
      plus how it is connected, and the plan is exposed as its own content rather
      than swallowed by a button whose descendants are presentational. Widening
      the click target to the whole card must not widen the accessible surface:
      the body button stays the row's ONE focusable element and its activation
      is what the card's handler reads, so keyboard and pointer each open the
      row exactly once. Percent and reset are text next to the bar, never color
      alone.
    since: 47

