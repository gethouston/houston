  - id: sidebar-team-block
    title: Sidebar team block
    purpose: >-
      One team in the navigation rail: its name and the agents that belong to
      it.
    anatomy: [header-row, team-glyph, team-name, disclosure-caret, rollup-badge, header-menu, identity-picker, agent-rows, empty-hint]
    states: [resting, active, collapsed, collapsed-active, collapsed-rollup, drop-target, drop-refused, empty, renaming]
    variants: [named-team, default-team]
    behavior: >-
      Every agent belongs to exactly one team, so the rail is a list of team
      blocks and nothing else. Named teams are the stored sidebar groups; the
      trailing DEFAULT team is the workspace itself, wearing the workspace name
      and holding every agent in no group.
      A block is ONE LADDER of rows, not a header with a list beneath it. The
      team row and every agent row share a single anatomy: one fixed row
      height, one glyph column, one type size, one rounded hover fill, and an
      active state that is a clearly-defined pill rather than a faint tint. Hierarchy is carried by an indent INSIDE the
      row, so the pills line up in one clean column down the block's left edge
      instead of stepping in and out with their contents; a row's glyph also
      inherits its label's colour, so an active row brightens as one object
      rather than as a label with a stale mark beside it. Any of the three row
      kinds drifting in height or indent makes the block read as several stacked
      lists, which is exactly what it used to do.
      That ladder is not the block's alone. EVERY interactive line in the rail
      is the same row wearing different options -- the top-level destinations
      above the list, the band that names it, each team header, each destination
      row, each agent, and the New agent row that closes it -- so the whole rail
      is one column of pills with one glyph column running down it, and there is
      exactly one indent step between a row that heads something and a row that
      hangs under one. Weight states that DEPTH and never the state: a block-
      level row is medium and a child row is regular, whatever is selected, so
      clicking a row cannot re-measure its label and shift where a long agent
      name truncates. The two things deliberately outside the shared row are the
      collapsed icon rail, which is a different anatomy rather than a narrower
      one, and inline rename, because a text field is not a state of a button.
      The team row itself is ONE hit target carrying the glyph, the name, the
      caret that states whether the block is open and the block's rollup badge,
      with the "..." menu beside it rather than inside it. It used to be three
      separate controls sharing one job, which cost a keyboard user three stops
      to reach a single disclosure. The caret is an INDICATOR and takes no
      clicks of its own: what the row does depends on where the user already
      is, so a caret claiming to be the fold button would promise an outcome it
      does not own.
      Clicking a team's name answers four questions with one gesture. From
      anywhere else it OPENS that team, unfolds it, and folds every other block
      -- an accordion, because a rail of eight expanded teams is a list of
      agents with headings in it, and the team just asked for is the only one
      whose members are worth the space. From another of the same team's
      surfaces it simply comes back to the team's work. On the team's own work,
      it folds the block, and folds it back open on the next click. Folding is
      the only one of the four that does not move the screen: the rail may fold
      while the surface stays, which is deliberate and user-invoked.
      The team's glyph is the team's IDENTITY: a solid mark the user picked
      from a curated set, tinted by a colour they picked from the SAME palette
      the agent avatars below it use. One vocabulary, so a team and an agent can
      never mean two different purples, and a team stays recognisable at a
      glance in a rail full of blocks. A team that has chosen neither wears a
      neutral people mark inheriting the row's own colour, which is what every
      block looked like before and is still what most of them look like. This
      is the one place a rail glyph pins a colour, and it is deliberate: the
      mark is identity a person chose, not decoration a component invented.
      Collapsing folds away EVERYTHING under the header. The hole that leaves is
      answered by the header twice over. It wears the selected pill whenever the
      open view belongs to this team, folded or open alike -- with no
      destination rows left in the block, the header is the only row that can
      answer "where am I" for a team at all. And it picks up a ROLLUP of what
      its hidden agent rows were signalling: the sum of their waiting work as a
      badge, and the same running treatment an agent's mark wears if any member
      is working. Both only while folded, because an open block's rows say it
      themselves and two badges in one block would count the same work twice.
      Folding a team must never mean losing sight of it.
      The DEFAULT block renders and folds exactly like a named team. One that
      folded everywhere except there would make the team everybody has the one
      row in the rail that answers a click differently, which is the kind of
      exception a user reads as a bug. Its folded state is persisted separately
      from the stored groups, because the block is virtual -- it is the
      container, not a record -- and its absence reads as open, so every layout
      written before it stays untouched. What it still does not get is what the
      container itself lacks: no rename, no delete, no leave, no menu at all,
      and no drag handle.
      A block holds MEMBERS and nothing else. A team's sections live on the
      screen its name opens, as tabs over the team's own work: four rows per
      team spent most of the rail on the same four words repeated, and the
      rail's job is to say WHICH team, not which of its surfaces. Selecting an
      agent opens its team's work pre-filtered to that agent, so the rail and
      the open view always agree on where the user is.
      A DRAG reorders and nothing more: an agent inside its own team, a team
      block among its siblings. An agent dragged over any other block is
      REFUSED -- no block offers to receive it and the lifted copy dims -- because
      a drop across blocks was the one gesture here that changed what a team
      HOLDS, and a slip of the wrist across a rail full of blocks is not a way
      to decide that. Moving an agent to another team is a named action on the
      team's own screen, where it can be read before it is taken.
      Where teams are SERVER-OWNED and shared with other people, the blocks are
      the teams the caller has JOINED. A team they have not joined is not a
      block at all: it lives in the band's Join menu (see sidebar-teams-band),
      because the rail is a working surface and not a directory. Joining is
      sidebar PINNING, not a grant: it moves the team into the rail and nothing
      else, because who may see a team's agents was already settled by the
      space's roles, and a rail that implied otherwise would be selling
      permission it does not hold. Leaving is the same move backwards, which is
      why it lives at the BOTTOM of the header menu behind a separator:
      everything above it edits the team, and this one edits the caller's
      relationship to it. Which menu entries a block offers is decided PER TEAM,
      not once for the rail -- the caller may own one team and merely belong to
      the next -- and a block that offers none shows no menu at all rather than
      an empty one. Creating a team asks for the name FIRST: the new block is a
      local draft until a name is committed, and abandoning the field removes
      it, so no placeholder-named team is ever broadcast to the people sharing
      the space.
    a11y: >-
      The team row is ONE button carrying aria-expanded and an aria-controls
      pointing at the region it folds, so the disclosure is announced rather
      than inferred from a rotating caret; the caret is decorative and hidden.
      The default block's row is that same button -- it folds a real region, so
      it makes a real promise, which is the opposite of the inert label it used
      to be. It carries aria-current="page" whenever the team's work is the open
      view, so "you are here" survives folding instead of vanishing with the
      rows it hid, and its rollup badge and running treatment both carry a
      spoken label with the number in it, since the rail must never turn into a
      wall of digits to be read. The "..." menu is always rendered rather than revealed on
      hover: a control that exists only under a cursor is unreachable by touch
      and invisible to anyone scanning the rail.
    since: 55

  - id: sidebar-teams-band
    title: Sidebar teams band
    purpose: >-
      The furniture wrapping the rail's team blocks: the band that names the
      list and folds all of it, the one menu that creates teams and agents, and
      the New agent row that closes the list. The BAND itself is shared with the
      two nav runs above it (see sidebar-nav-band).
    anatomy: [band-label-toggle, band-caret, add-menu-trigger, add-menu, add-agent-row]
    states: [resting, collapsed, menu-open]
    variants: [personal, shared-space]
    behavior: >-
      The band is the rail's list header and its only LIST-level control -- one
      per rail, however many team blocks hang under it, which is what makes it a
      different thing from the block headers it sits above.
      Its LABEL is the toggle. The caret sits immediately after the words rather
      than pinned to the far edge, so the control reads as one phrase you can
      click instead of a label that happens to have an arrow near it, and the
      button is sized to its text because everything to the right of the words
      belongs to the action, not to the disclosure. Folding it puts every team
      block away at once, and the state is persisted: a rail that forgets it was
      folded on every reload is worse than one that never folded. Folding is an
      EXPANDED-rail idea only -- the icon rail has no band to fold from, so it
      must never inherit a hidden list.
      ONE "+" menu carries everything the rail can create: New agent and New
      team. Those used to be two unnamed glyphs sitting on a row that already
      had a label. Browsing and joining OTHER teams is gone entirely: a member
      sees only the teams they are part of, and people are added to a team from
      its settings, so the rail no longer stacks teams the user never opens
      underneath the few they live in. The menu degrades to a plain named button
      when there is exactly one thing to create, and renders nothing when there
      is none.
      New agent is ALSO a visible row at the foot of the list, not only a menu
      entry, because creating an agent is the rail's primary action and a
      primary action may not live one level deep inside a menu. That row wears
      the child-row geometry of the blocks above it (see sidebar-team-block), so
      the list ends on the same ladder it was drawn on rather than on a control
      that has floated free of it, and it is the one the guided tour points at.
    a11y: >-
      The label is a real button with aria-expanded and an aria-controls
      pointing at the list it folds; its caret is decorative and hidden. The
      menu trigger carries an accessible name of its own rather than borrowing
      the band's, because a "+" says nothing aloud. The add row is a button
      inside the list's own reading order, not chrome parked outside it.
    since: 58

  - id: sidebar-nav-band
    title: Sidebar nav band
    purpose: >-
      The rail's top-level destinations above the team list, and the two bands
      that name them: My accounts and Workspace.
    anatomy: [nav-row, nav-glyph, nav-label, nav-count-badge, band-label-toggle, band-caret, footer-row]
    states: [resting, hover, active, collapsed, with-count, icon-rail]
    variants: [unlabelled-run, labelled-run]
    behavior: >-
      Two destinations LEAD the rail with no band over them, because they are
      the two a user heads for without being asked: where work arrives, and
      where agents come from. Everything else is filed under a band that says
      whose it is. The leading run also carries the offer to be WALKED through
      the app, beside the store a new user opens first: the guided tour is a
      destination people go looking for, not a control hiding on one screen's
      chrome. My accounts holds the connections that belong to the PERSON, the
      apps they have authorised and the AI accounts their turns run on: nobody
      else in the space is affected by either. Workspace holds what the whole
      SPACE is made of and belongs to the people who run it: who is in it, who
      may use which agent, its skills, and how long its agents have worked. A
      plain member is not shown any of that, so for them the band does not
      exist at all.
      Settings is not in any of those runs. It belongs to the person rather
      than to the space, and it has to be reachable in every deployment,
      including the ones where the Workspace band is absent entirely, so it is
      a permanent row in the rail's FOOTER beside the account menu.
      A band whose rows are all hidden by a gate is DROPPED with its rows: a
      heading may never outlive the list it names.
      The bands are the SAME band as the team list's below them, down to the
      type step, the caret placement, the fold, the gap under the heading and
      the LEFT EDGE all three sit on. Three headings in one rail that folded,
      sat or aligned differently would be three rules for one row shape, so
      there is one of them wearing three labels and the inset is spent exactly
      once per heading. Each remembers its own fold, per machine.
      There is no general mission board among these rows. Every board belongs to
      a team, so the app opens on the first team's board and the only
      destination here that needs no team is the inbox, which is where the app
      waits while the teams are still arriving.
      The inbox row carries a count when someone has typed your name, and
      nothing at all when they have not: a permanent zero is a number the eye
      learns to skip, leaving the row no way to say something arrived. It is the
      same count, from the same list, as the notifications control on a board.
      The icon rail drops the bands and every fold with them: a heading has
      nowhere to go at that width, the labels it would carry are already in each
      glyph's tooltip, and a run left folded there would strand a destination
      with nothing on screen to bring it back.
    a11y: >-
      Each band label is a real button carrying aria-expanded and an
      aria-controls pointing at the run it folds; its caret is decorative. A
      destination row announces its own name plus its count when it has one, so
      the number is never carried by colour or position alone. In the icon rail
      every row keeps an accessible name through its tooltip trigger.
    since: 59

  - id: team-identity-picker
    title: Team identity picker
    purpose: >-
      The popover behind a team's "Change icon & color": a grid of solid marks
      and a row of colour swatches, applied as they are clicked.
    anatomy: [menu-entry, icon-grid, icon-cell, swatch-row, swatch, reset-entry]
    states: [resting, hover, selected, none-chosen, applied]
    variants: [named-team, default-team]
    behavior: >-
      A team's identity is a GLYPH NAME and a COLOUR, both optional and both
      edited by whoever may rename the team. The set of marks is the client's
      own curated vocabulary rather than an image upload or an open icon
      library: a fixed set is the only way every mark reads at rail size and
      renders the same on every surface, and it costs the user a choice instead
      of a design task. The colours are not a new palette either -- they are the
      same swatches an agent's avatar uses, so one vocabulary of colour carries
      identity everywhere.
      Every pick is applied IMMEDIATELY and optimistically: the rail repaints
      the moment a mark is clicked, and a refusal puts the previous identity
      back and says why in the user's own words. Choosing a mark before a
      colour has to look right, so the grid itself is tinted by whatever colour
      is currently chosen -- picking either half previews the pair.
      Clearing is a first-class choice, not a missing one: a single Default
      entry drops BOTH fields and returns the team to the neutral mark, and it
      is offered only when there is something to clear.
      The catch-all team is included. Restyling is a rename, not a structural
      change, so a team you may name is a team you may style.
    a11y: >-
      The entry opens a submenu of the block's own "..." menu, so it is reached
      by keyboard the same way every other block action is. Each mark and each
      swatch is a real button carrying its own name and a pressed state, so the
      current choice is never signalled by colour or position alone.
    since: 60

  - id: team-screen
    title: Team screen
    purpose: >-
      The full-window surface behind a team block's destination rows: one
      team's missions, what its agents do on their own, what they keep, and the
      agents that belong to it.
    anatomy: [board-toolbar, team-title, agent-filter, mission-board, archived-board, routines-list, files-browser, failed-agents-strip, empty-state, settings-agent-list, agent-drill-in, members-card]
    states: [mission-control, mission-control-filtered, archived, routines, files, empty, partially-unavailable, settings, settings-agent-detail, settings-members]
    variants: [named-team, default-team]
    behavior: >-
      ONE screen serves every team: which team and which of its sections are
      open is state, so a team can be renamed, reordered or deleted without
      leaving a dead view behind, and a team that stops existing sends the user
      home, to the first team's board, rather than to a blank pane. The sections it can
      show are exactly the destination rows the team block offers, so the rail
      can never point at something the screen will not render; a section the
      caller may not open resolves to Mission Control. Mission Control is the
      SAME board the global one is, narrowed to the team's agents and titled
      with the team's name, reading the one cross-agent sweep rather than
      starting its own. Its agent filter is shared with the rail in both
      directions: selecting an agent row filters the board, and picking one in
      the board's own filter menu moves the lit row -- except under Team
      Settings, which ignores the pin and lists the whole team, so no agent row
      is filled there. An empty team says why it
      is empty -- the workspace's own team offers the create-an-agent door, a
      named team says to drag one in, because that is where a new agent would
      land. Routines is ONE list of every team agent's routines, each row
      naming its owner, because a routine is a flat thing and a team wants to
      see what runs on its behalf in one place; routines still being BUILT in
      chat are rows here too, resumable and discardable, so one started from
      this surface never vanishes from it. Files is the opposite call:
      folders are not flat and merging several agents' trees would invent a
      filesystem nobody has, so the section picks ONE agent and shows that
      agent's real tree, with every action the per-agent surface offers.
      Both read the same per-agent caches the per-agent surfaces do, so an
      event that refreshes one refreshes the other; when some agents answer and
      others do not, the section says which ones failed and offers to retry
      just those (and to report it), rather than presenting a short list as the
      whole truth -- and when NOTHING answered it stops claiming the team is
      idle at all. Team
      Settings lists the team's agents with the same plain-language access line
      every agent list shares, and opening one drills into the ONE canonical
      agent settings page rather than a second copy of it.
      Below the one breakpoint the strip gives its row up: the identity
      lozenge (and, drilled, the back chip) rides the phone top bar between the
      drawer control and the compose control, so the screen card opens on the
      section's own content rather than a second chrome row. Only the screen
      on the glass claims that slot.
      Where teams are server-owned, Team Settings is also where a team is NAMED
      and where its PEOPLE are, in a members card under the agents: the rows are
      EXPLICIT memberships only, so a card that lists nobody is not a claim that
      nobody can reach the team, and it says as much -- owners and admins of the
      space manage every team without ever appearing in it, and the space's
      catch-all team holds no rows at all because everybody is in it. Only a
      team's owner sees the controls that write (making someone an owner,
      removing them); everyone else reads the same list. This is also the only
      door to renaming the catch-all team, whose rail block deliberately offers
      no menu. The caller's own Join and Leave sit here too, next to the list
      that explains what they mean.
    a11y: >-
      The board's team name is the screen's h1; the filter menu names the agent
      it is pinned to; the settings drill-in is framed by a labelled back
      control naming the team it returns to; every members-card control names
      the person it acts on.
    since: 55

  - id: mobile-tab-bar
    title: Mobile tab bar
    purpose: >-
      The phone shell's bottom bar: the three places the app is, one tap away,
      below 768px only.
    anatomy: [tab-row, tab-glyph, tab-label, needs-you-badge]
    states: [resting, active, with-count]
    variants: []
    behavior: >-
      Three tabs and never a fourth: Agents (the landing tab), the Tasks board,
      and Settings. Chat is never a tab, a new task starts from the top bar's
      compose control, and the long tail (store, skills, workspaces) stays in
      the drawer, so the bar stays three thumb-sized certainties rather than a
      scrolling menu. Switching tabs RESETS the navigation trail to the tapped
      tab's root, the way native tab bars do: the old tab's drill-in is
      abandoned, and the hardware back button afterwards stays on the new tab
      instead of resurrecting what the user navigated away from. Every location
      in the app lights exactly one tab -- Settings its own screen, an
      unnarrowed team board the Tasks tab, and everything else the Agents
      landing tab -- so the bar is never dark. The Tasks tab carries the same
      needs-you count badge the rail's rows wear, the cross-agent sum of
      missions waiting on the user, and shows nothing at zero. The bar pads
      itself against the phone's home indicator. While a chat is up -- the
      pushed mission-chat-screen, or the board's full-screen panel -- the bar
      hides: chat is a push, not a tab, so its own back affordance and the
      hardware back button are the way out, and the composer gets the full
      height above the on-screen keyboard. Any navigation underneath (a tab
      root, a notification jump) closes the chat and brings the bar straight
      back.
    a11y: >-
      A nav landmark with an accessible name; each tab is a real button
      carrying aria-current on the active one, and the count badge announces
      its meaning ("N issues need you") rather than a bare number. Targets are
      at least 44px tall.
    since: 70

  - id: agents-home
    title: Agents home
    purpose: >-
      The phone's landing screen and the Agents tab's root: every agent as a
      two-line cell, sorted by who needs attention.
    anatomy: [title, name-filter, agent-cell, agent-avatar, running-ring,
      needs-you-chip, preview-line, relative-time, empty-state]
    states: [list, filtering, filter-empty, no-agents, previews-loading]
    variants: []
    behavior: >-
      One cell per agent, attention-sorted: agents with missions waiting on
      the user first, then agents with running work, then everyone else, and
      inside each band the most recently active agent leads. The cell's first
      line is the agent's name beside the same needs-you count chip the rail
      rows and the Tasks tab badge wear (one badge shape, one number, never a
      recount); its avatar wears the same running ring the rail draws. The
      second line previews the most recently moved mission's title with the
      movement's relative time flushed right, so the list reads like a chat
      list: who moved, and how long ago. A name filter under the title narrows
      the list as the user types and owns its own empty line when nobody
      matches; with no agents at all the screen says so instead of rendering a
      hollow list. Counts and previews read the same conversation sweep and
      per-agent summaries every other badge surface reads, repainting through
      the ordinary event invalidation, never a fetch path of their own.
      Tapping a cell adopts the agent as current and pushes its missions
      screen onto the navigation stack, so back pops out of the drill.
    a11y: >-
      The screen's title is its h1; the filter is a labelled search input;
      each cell is one real button at least 56px tall named by the agent, with
      the chip and the running ring carrying their own accessible labels ("N
      issues need you", "N issues running") rather than bare numbers.
    since: 71

  - id: agent-missions-list
    title: Per-agent missions list
    purpose: >-
      One agent's missions as a sectioned phone list, pushed from the Agents
      home; the drill level between the agent list and a mission's chat.
    anatomy: [back-bar, agent-masthead, section-header, mission-row,
      relative-time, archived-toggle, empty-state]
    states: [sectioned, archived-collapsed, archived-expanded, no-missions]
    variants: []
    behavior: >-
      A back bar returns to the Agents home (a navigation-stack retreat, so
      the hardware back button does the same thing), under a masthead naming
      the agent with its avatar and running ring. The missions split into the
      board's own sections -- Needs you, Running, Done, by the exact status
      mapping the board's columns use, an errored mission sitting in Needs you
      -- each newest movement first, and an empty section vanishes rather
      than rendering hollow. The archive folds behind a trailing row naming
      its count; expanding it lists the archived missions inline. Tapping an
      active mission pushes its mission-chat-screen as the next
      navigation-stack level, the same push a board card performs, so back
      pops straight from the chat to this list. An archived mission has no
      chat screen: its rows keep the notification navigation (the agent
      becomes current, its board opens with the archive surface swapped in,
      and the chat opens over it). An agent with no missions at all gets the honest empty
      state pointing at the compose control. Rows read the same conversation
      sweep the boards read and live-update through the same invalidation.
    a11y: >-
      The back control is a labelled button naming the level above; the agent
      masthead is the screen's h1; section headers are real headings; every
      mission row is one button named by the mission's title; the archived
      toggle is a button carrying aria-expanded.
    since: 71

  - id: mission-chat-screen
    title: Mission chat screen
    purpose: >-
      The phone's full-screen chat, pushed as a first-class navigation level
      from a board card, an Agents-home mission row, or the compose flow.
    anatomy: [back-chevron, agent-avatar, agent-name, mission-line,
      message-log, composer]
    states: [conversation, draft, running, loading-history]
    variants: []
    behavior: >-
      Chat is a PLACE on the phone, never a panel: opening a mission pushes
      this screen onto the navigation stack over whatever screen the user was
      on, and its back chevron and the hardware back button pop the same
      level, landing exactly where the push happened. Both mobile bars hide
      while it is up. The chat itself is the one shared chat the desktop
      panel renders -- same message log, composer, queued follow-ups, drafts,
      child-mission links and per-agent features, driven by the same shared
      view-models -- so the two surfaces cannot drift. A draft chat (the
      compose flow) opens the screen with no mission and creates one on the
      first send, replacing itself in place so back never revisits the blank
      composer; opening a child or parent mission from the chat pushes that
      mission's screen. Deleting or archiving the open mission closes the
      screen. The composer stays above the on-screen keyboard (the screen
      pads itself by the visual viewport's occluded bottom), pads against the
      home indicator, and the log keeps its stick-to-bottom anchoring when
      the keyboard opens or closes. Navigating anywhere underneath closes the
      chat.
    a11y: >-
      The back control is a labelled button; the header names the agent and
      the mission in text; the log is a live region the way the shared chat
      already marks it; the composer input is at least 16px so the phone
      never zooms it.
    since: 72

  - id: new-mission-sheet
    title: New mission compose sheet
    purpose: >-
      The phone's compose flow: a bottom sheet asking which agent should run
      the new task, leading into an empty draft chat.
    anatomy: [sheet, title, description, agent-row, agent-avatar]
    states: [open, closed]
    variants: []
    behavior: >-
      Opened by the compose control (the top bar's and the board control
      row's, one rule). With several agents it lists one row per agent;
      picking one dismisses the sheet and pushes that agent's empty draft
      mission-chat-screen. With exactly one agent the question is skipped and
      the draft chat pushes directly; with none the app falls back to its one
      shared home navigation. The sheet pads against the home indicator and
      dismisses on scrim tap or swipe-down without navigating.
    a11y: >-
      A modal dialog with its title as the accessible name; each agent row is
      one real button named by the agent, at least 44px tall; dismissal is
      reachable by the sheet's own close affordance, never scrim-only.
    since: 72
