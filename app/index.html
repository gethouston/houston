<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover lets the document extend under the notch / home
         indicator so env(safe-area-inset-*) resolves (see the safe-area
         utilities in ui/core/src/globals.css); without it every inset is 0. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- Browser/OS chrome colour (mobile URL bar, PWA title bar). Same values
         as the pre-JS frame below: light screen #fcfcfc, dark gutter #141416.
         The guard script flips it pre-paint; app/src/lib/theme-boot.ts keeps
         it in sync with every later theme change. -->
    <meta name="theme-color" content="#fcfcfc" />
    <title>Houston</title>
    <!-- Pre-JS frame. The app's CSS arrives with the app bundle, so the FIRST
         painted frame is whatever this document says — before any module runs.
         `houston.theme.cache` is the boot mirror written by
         app/src/lib/theme-boot.ts; reading it here (parser-blocking, so it lands
         before first paint) lets that frame already match the theme
         `applyBootTheme()` is about to apply, instead of flashing the wrong one.
         Values are the design tokens the first app frame paints: light
         `--ht-background` #fcfcfc (the boot splash's screen surface) and dark
         `--ht-base` #141416 (the opaque gutter the splash's frosted glass sits
         on). No mirror yet (first launch) or storage unavailable -> light, the
         document default, exactly how applyBootTheme() resolves it.
         KEEP IDENTICAL to packages/web/index.html — same document, two shells. -->
    <style>
      html {
        background: #fcfcfc;
      }
      html[data-theme="dark"] {
        background: #141416;
      }
      body {
        margin: 0;
      }
    </style>
    <script>
      try {
        if (localStorage.getItem("houston.theme.cache") === "dark") {
          document.documentElement.setAttribute("data-theme", "dark");
          document
            .querySelector('meta[name="theme-color"]')
            .setAttribute("content", "#141416");
        }
      } catch (e) {
        /* storage disabled/hardened webview — same as a first launch */
      }
    </script>
    <!-- Classic (non-module) script. `defer` (not parser-blocking) so it runs
         AFTER the document is parsed and #root exists, yet still before the
         deferred app bundle (defer scripts + module scripts execute in document
         order, and this comes first). A parser-blocking script in <head> would
         run before <body>, find no #root, and paint nothing -> white screen.
         Shows a clear message instead of a white screen when the system WebView
         is too old to run Houston (issue #102). Served verbatim from public/. -->
    <script defer src="/compat-gate.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
