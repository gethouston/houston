<!doctype html>
<html lang="en" translate="no">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover lets the document extend under the notch / home
         indicator so env(safe-area-inset-*) resolves (see the safe-area
         utilities in ui/core/src/globals.css); without it every inset is 0. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- Browser/OS chrome colour (mobile URL bar, PWA title bar). Same values
         as the pre-JS frame below: light screen #fcfcfc, dark gutter #141416.
         The guard script flips it pre-paint; app/src/lib/theme-boot.ts keeps
         it in sync with every later theme change. -->
    <meta name="theme-color" content="#fcfcfc" />
    <!-- Houston ships its own es/pt UI, so browser page translation (Chrome,
         Safari, Edge) only corrupts it: the translator wraps every text node
         in <font> elements, and React's next commit throws NotFoundError from
         removeChild/insertBefore and loses the whole screen to the crash card.
         `translate="no"` on <html> is the standard opt-out; the google meta
         is the older spelling some translators still key on. Chat replies
         are covered too: a streaming reply re-renders constantly, so it is
         the surface a translator breaks first. app/src/lib/foreign-dom-guard.ts
         is the safety net for translators that ignore both. -->
    <meta name="google" content="notranslate" />
    <title>Houston</title>
    <!-- Installable web app (PWA). The manifest (served verbatim from public/)
         is what Chrome/Android and desktop browsers read for "Install app":
         name, standalone display, Houston icon. iOS Safari ignores the manifest
         icons and reads apple-touch-icon for "Add to Home Screen", and the
         apple-mobile-web-app-* metas make the installed app open without
         browser chrome. Status bar style stays `default`: the OS paints it in
         the theme-color above (light/dark), content starts below it, so the
         safe-area top inset is 0 and nothing overlaps the top bar. No service
         worker on purpose: the bundle is served no-cache so every launch picks
         up the current release, and an offline cache would only serve stale
         chunks against a live host. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Houston" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <!-- Pre-JS frame. The app's CSS arrives with the app bundle, so the FIRST
         painted frame is whatever this document says — before any module runs.
         `houston.theme.cache` is the boot mirror written by
         app/src/lib/theme-boot.ts; reading it here (parser-blocking, so it lands
         before first paint) lets that frame already match the theme
         `applyBootTheme()` is about to apply, instead of flashing the wrong one.
         Values are the design tokens the first app frame paints: light
         `--ht-background` #fcfcfc (the boot splash's screen surface) and dark
         `--ht-base` #141416 (the opaque gutter the splash's frosted glass sits
         on). No mirror yet (first launch) or storage unavailable -> light, the
         document default, exactly how applyBootTheme() resolves it.
         KEEP IDENTICAL to app/index.html — same document, two shells. -->
    <style>
      html {
        background: #fcfcfc;
      }
      html[data-theme="dark"] {
        background: #141416;
      }
      body {
        margin: 0;
      }
    </style>
    <script>
      try {
        if (localStorage.getItem("houston.theme.cache") === "dark") {
          document.documentElement.setAttribute("data-theme", "dark");
          document
            .querySelector('meta[name="theme-color"]')
            .setAttribute("content", "#141416");
        }
      } catch (e) {
        /* storage disabled/hardened webview — same as a first launch */
      }
    </script>
    <!-- crypto.randomUUID is only available in secure contexts (HTTPS/localhost).
         Polyfill for plain HTTP deployments using getRandomValues, which IS
         available in insecure contexts. -->
    <script>
      if (typeof crypto !== "undefined" && !crypto.randomUUID) {
        crypto.randomUUID = function () {
          var b = new Uint8Array(16);
          crypto.getRandomValues(b);
          b[6] = (b[6] & 0x0f) | 0x40;
          b[8] = (b[8] & 0x3f) | 0x80;
          var h = Array.from(b).map(function (x) {
            return x.toString(16).padStart(2, "0");
          }).join("");
          return (
            h.slice(0, 8) + "-" + h.slice(8, 12) + "-" +
            h.slice(12, 16) + "-" + h.slice(16, 20) + "-" + h.slice(20)
          );
        };
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
