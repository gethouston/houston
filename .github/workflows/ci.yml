# Houston PR CI Gate
#
# Fast, hermetic, secret-free TypeScript gate that runs on every pull request
# targeting `main`. pnpm owns every JS/TS package and Vitest owns unit/contract
# tests. Bun is deliberately absent from this workflow; it remains only for the
# host-sidecar binary compile workflow (`scripts/build-host-sidecar.sh`).

name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    # Decides whether the Playwright jobs below (the web shards and the
    # visual suite) run on this PR. Those suites drive app/src through
    # packages/web against the in-process fake host, so their inputs are the
    # web package's pnpm closure (`pnpm --filter "houston-web..."`: app/src,
    # ui/*, every packages/* member except runtime, code-sandbox and
    # agentstore-client, which none of the Playwright inputs import; the
    # fake host pulls two host modules in and never spawns a runtime. The
    # web UNIT tests do import one runtime module, and they run in the
    # ungated App job), plus the files that shape the install and this
    # workflow. A PR outside that set (the Tauri shell, runtime-only, docs,
    # scripts, other workflows: 19 of the 80 PRs merged before this job
    # existed) skips the 7 jobs it cannot fail.
    # Pushes to main and manual dispatches always run everything, so the
    # daily cut's "main is green" guard keeps seeing the full set.
    # The TS checks, unit and App jobs do not depend on this job and run on
    # every PR.
    # Two limits of the API path: the PR file listing stops at 3,000 files,
    # so a PR larger than that could skip the suites; and a merge_group
    # event (if a merge queue is ever enabled) is not a pull_request, so it
    # would need a checkout plus `base` for the action, or to run everything.
    name: Changed paths
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      web: ${{ github.event_name != 'pull_request' || steps.filter.outputs.web == 'true' }}
    steps:
      # On pull_request the action lists the PR's files through the API, so
      # no checkout is needed. A pattern starting with `!` excludes; a file
      # has to match one plain pattern and no excluded one.
      - name: Match the PR's files against the web suites' inputs
        if: github.event_name == 'pull_request'
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          predicate-quantifier: some-with-excludes
          filters: |
            web:
              - 'app/**'
              - '!app/src-tauri/**'
              - 'ui/**'
              - 'packages/**'
              - '!packages/runtime/**'
              - '!packages/code-sandbox/**'
              - '!packages/agentstore-client/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - '.npmrc'
              - 'patches/**'
              - 'tsconfig.json'
              - '.github/workflows/ci.yml'

  checks:
    name: TS checks (lint · typecheck · contract tests)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Biome check
        run: pnpm check

      - name: Boundary check
        run: pnpm check:boundaries

      - name: AppImage sidecar repair regression test
        run: scripts/test/repair-linux-appimage-sidecar.test.sh

      - name: macOS notarize script regression test
        run: scripts/test/notarize-dmg.test.sh

      - name: Ship train scripts regression test
        run: scripts/test/ship-train-scripts.test.sh

      - name: Parity check (cross-surface component inventory)
        run: pnpm check:parity

      - name: Typecheck (pnpm workspace)
        run: pnpm -r typecheck

      # The engine pods run the BUNDLED host/runtime, and bundling can fail in
      # ways nothing above can see: an import that pulls a module into esbuild's
      # async-init subgraph makes it emit `await init_x()` inside a non-async
      # wrapper, and the bundle dies at startup with `SyntaxError: Unexpected
      # reserved word`. That shipped once (HOU-952) — typecheck and 1,984 tests
      # were green, and the only build that would have caught it runs AFTER
      # merge. Bundling takes ~50ms; parse the output here instead.
      - name: Engine bundle parses (host + runtime)
        run: |
          set -euo pipefail
          node selfhost/bundle.mjs
          node --check dist/runtime/main.mjs
          node --check dist/host/main.mjs

      # The host and runtime suites run in the `unit` matrix below; what is
      # left here sums to about 30 s.
      - name: Unit + contract tests (Vitest)
        run: |
          set -euo pipefail
          pnpm --filter @houston/domain test
          pnpm --filter @houston/code-sandbox test
          pnpm --filter @houston/engine-adapter test
          pnpm --filter @houston/wire-types test
          pnpm exec vitest run scripts/check-parity.test.mjs scripts/publish-starter-agents.test.mjs scripts/lib/release-train.test.mjs scripts/ci/updater-signature.test.mjs scripts/ci/tar-entries.test.mjs scripts/gen-manychat-openapi.test.mjs scripts/sdk-parity scripts/assistant-catalog/tests

  unit:
    # The Vitest step used to run six packages one after another in the TS
    # checks job: 6.2 min p50 and growing (4.2 min two weeks earlier). Two
    # packages were almost all of it, runtime 204 s and host 123 s against
    # about 30 s for the other four plus the scripts suite (run 37781633940).
    # Each gets its own runner here, so the TS checks job no longer sits at
    # the edge of the Playwright shards' time, and the two suites keep
    # growing without moving the wall clock. Same commands, same arguments.
    name: Unit tests (${{ matrix.package }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        package: [runtime, host]
    steps:
      # Same actions the sibling jobs run, at the commits their `v4` tags
      # resolve to today, pinned. The suites never push, so the token is not
      # kept in the checkout.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Vitest
        env:
          PACKAGE: ${{ matrix.package }}
        run: pnpm --filter "@houston/${PACKAGE}" test

  web:
    # The UI suite is split across runners with Playwright's native --shard.
    # Each shard builds the web bundles and runs three workers against them
    # behind `vite preview`; why a prebuilt bundle and not the dev server, and
    # why three, is in packages/web/e2e/support/serve-mode.ts. The build runs
    # per shard (under a minute): a build job plus an artifact round trip
    # would put more than that on every shard's critical path.
    # The web typecheck and unit tests run in the App job, so no shard carries
    # extra work and the slowest slice alone sets the wall clock.
    #
    # Shard count: each shard pays about 1 min of checkout, install and
    # browser cache before its slice, and the org is on the plan with 20
    # concurrent jobs, shared with the cloud repo (peak 21 running jobs and
    # 20 min queue waits on the evening of 2026-10-07 when four PRs ran at
    # once). A full run of this workflow takes the list length plus 6 jobs;
    # runs that skip the Playwright jobs (see `changes`) take 6. Twelve
    # shards were measured on PR #1737 (slowest shard 7.9 min against 12.6
    # at six) and rejected: once a runner serves a prebuilt bundle to more
    # than one worker the slice is a few minutes and the fixed cost
    # dominates, while the extra runners queue every other PR. The list is
    # the ONLY place the count lives: `--shard` reads its total from
    # `strategy.job-total`.
    name: Web (UI tests)
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # No apt in this job. `playwright install --with-deps` ran apt-get on
      # every shard, and each mirror has now taken the whole 30-minute job
      # in turn: azure.archive.ubuntu.com on 2026-08-19 (the fix pinned
      # archive.ubuntu.com), then archive.ubuntu.com itself on 2026-09-11
      # (run 34598755800: one package every 4-5 minutes, three shards timed
      # out on three attempts). The runner image already ships every
      # library Chromium needs - that run's apt transcript installed NINE
      # packages, all fonts (fonts-freefont-ttf, fonts-ipafont-gothic,
      # fonts-wqy-zenhei, xfonts-*...), which these functional shards do
      # not depend on; the pixel-exact visual suite runs inside the pinned
      # Playwright image below. The browser itself comes from Playwright's
      # CDN and is cached per Playwright version, so a warm shard downloads
      # nothing. A library the image stops shipping fails the smoke launch
      # in seconds with Playwright's own missing-dependency list, never a
      # silent 30-minute stall.
      - name: Playwright version
        id: playwright
        run: echo "version=$(node -p "require('./packages/web/package.json').devDependencies['@playwright/test']")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright Chromium
        id: playwright-cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install Playwright Chromium
        if: ${{ steps.playwright-cache.outputs.cache-hit != 'true' }}
        timeout-minutes: 5
        run: pnpm --filter houston-web exec playwright install chromium

      - name: Smoke-launch Chromium (host dependency check)
        timeout-minutes: 2
        run: pnpm --filter houston-web exec node -e "require('@playwright/test').chromium.launch().then((b) => b.close())"

      # Both web servers' bundles (identity off and on), built concurrently.
      - name: Build web bundles (e2e)
        run: pnpm --filter houston-web e2e:build

      - name: UI tests (Playwright)
        run: pnpm --filter houston-web test:e2e --shard=${{ matrix.shard }}/${{ strategy.job-total }}

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        # The report is a debugging aid; a GitHub artifact-service hiccup
        # (403 on FinalizeArtifact, seen on green shards) must not fail the job.
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-shard-${{ matrix.shard }}
          path: packages/web/playwright-report/
          retention-days: 14

  visual:
    name: Visual regression (Playwright screenshots)
    # Runs INSIDE the pinned Playwright image so the render matches the committed
    # `-linux` baselines pixel-for-pixel (same browser build, same fonts). The
    # image tag MUST track `@playwright/test` in packages/web/package.json — bump
    # both together, then regenerate baselines in the same image (see
    # packages/web/e2e/README.md → Visual regression → Platforms).
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Browsers ship in the image (PLAYWRIGHT_BROWSERS_PATH) — no install step.
      # The committed `-linux` baselines were recorded against the vite dev
      # server, so this job keeps serving from it (the functional shards
      # moved to the prebuilt bundle; packages/web/e2e/support/serve-mode.ts).
      - name: Visual tests (Playwright)
        env:
          HOUSTON_E2E_SERVE: dev
        run: pnpm --filter houston-web test:visual

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        # The report is a debugging aid; a GitHub artifact-service hiccup
        # (403 on FinalizeArtifact, seen on green shards) must not fail the job.
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: playwright-visual-report
          path: packages/web/playwright-report/
          retention-days: 14

  app:
    # Every check here is short and independent of the others, so they share
    # one install and one job. They run in sequence: on a 4-vCPU runner the
    # four lanes are CPU-bound, and running them as a `parallel:` group took
    # 4.2 min against a 4.1 min sequential sum. `!cancelled()` keeps a failure
    # in one lane from hiding the others, as separate jobs never did.
    name: App · Web unit · Agent Store (typecheck · tests · builds)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Unit tests (app)
        run: pnpm --filter houston-app test

      # The desktop bundle resolves the engine adapter through a Vite alias
      # that cannot see `@houston/app/*`. Only this build catches an adapter
      # import the web build resolves fine (every Tauri release build failed
      # on one while PR CI stayed green).
      - name: Desktop bundle (typecheck + vite build)
        if: ${{ !cancelled() }}
        run: pnpm --filter houston-app build

      - name: Web (typecheck · e2e harness typecheck · unit tests)
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          pnpm --filter houston-web typecheck
          pnpm --filter houston-web typecheck:e2e
          pnpm --filter houston-web test

      - name: Agent Store (contract + app typecheck · tests · DB-less build)
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          pnpm --filter @houston/agentstore-contract typecheck
          pnpm --filter @houston/agentstore-contract test
          pnpm --filter houston-agentstore typecheck
          pnpm --filter houston-agentstore test
          pnpm --filter houston-agentstore build
