name: Website Deploy

# Builds the Eleventy site in website/ and deploys it to Firebase Hosting
# (project: gethouston, site: gethouston-site). Runs automatically when
# website/ changes land on main; can also be triggered manually.
#
# ── Cutover choreography (Cloudflare Pages -> Firebase Hosting) ────────────────
# This job deploys to the gethouston-site.web.app Firebase site ONLY. It does
# NOT touch DNS and does NOT decommission Cloudflare. The apex/www DNS records
# for gethouston.ai still point at Cloudflare Pages until the human flip. Order:
#   1. Orchestrator creates the Firebase site once (see PR body):
#        firebase hosting:sites:create gethouston-site --project gethouston
#      (equivalently the Hosting REST API `sites.create` with siteId=gethouston-site).
#   2. This workflow runs on the next website/ push (or manual dispatch) and
#      publishes the build to https://gethouston-site.web.app.
#   3. Verify the deploy on https://gethouston-site.web.app (redirects, headers,
#      URL shape) while gethouston.ai still serves from Cloudflare.
#   4. Human adds the custom domain in Firebase Hosting and flips the apex/www
#      DNS records to Firebase, then retires the Cloudflare Pages project. The
#      src/_headers and src/_redirects files stay in the repo (harmless, unused
#      on Firebase — firebase.json is the source of truth) until that cleanup.
#
# ── GCP auth: Workload Identity Federation ────────────────────────────────────
#   SA: github-deploy-web@gethouston.iam.gserviceaccount.com — Firebase Hosting
#   deploy only. The WIF provider condition restricts this binding to
#   attribute.repository=='gethouston/houston'. firebase-tools authenticates via
#   the Application Default Credentials exported by google-github-actions/auth.
#
# ── Required repo secrets ─────────────────────────────────────────────────────
#   SUPABASE_ANON_KEY   - public (RLS-protected) Supabase anon key for the
#                         download form's mirror, the /data-partners/refer
#                         form (public.data_referrals) and the /data-partners
#                         "Book a call" form (public.data_partner_calls).
#   POSTHOG_KEY         - public PostHog ingest token (phc_...). base.njk omits
#                         the whole analytics snippet when it is empty, so a
#                         guard step fails the build loudly instead of shipping
#                         a blind site (this exact miss cost 2026-05-25 →
#                         2026-07-21 of website analytics when builds moved off
#                         Cloudflare Pages, which held the key in its dashboard).
# Optional (committed defaults exist):
#   SUPABASE_URL, WAITLIST_SHEET_ENDPOINT, POSTHOG_HOST
#   DATA_REFERRALS_SHEET_ENDPOINT - the "Data Partnerships - Referrals" sheet
#                         tab's Apps Script web app. No default: unset, the
#                         referral form stores to Supabase only
#                         (website/scripts/apps-script/data-partnerships-referrals.gs).
#   DATA_PARTNER_CALLS_SHEET_ENDPOINT - the "Data Partnerships - Calls" tab's
#                         Apps Script web app. No default: unset, the "Book a
#                         call" form stores to Supabase only
#                         (website/scripts/apps-script/data-partnerships-calls.gs).
#   CERTS_EXPORT_TOKEN  - bearer token for the gateway's /v1/certs/export
#                         endpoint, read at build time to generate the
#                         certificate pages and images. Deliberately NOT
#                         guarded: the data layer warns and yields an empty
#                         certificate set, so the rest of the site still ships.

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - '.github/workflows/website-deploy.yml'
  workflow_dispatch:

concurrency:
  group: website-deploy
  cancel-in-progress: true

jobs:
  # The /data-partners/refer form stores into public.data_referrals and the
  # /data-partners "Book a call" form into public.data_partner_calls, both with
  # the anon key. If a table is missing (its migration not applied), every
  # submission to its form on the live site fails, and nothing else would say
  # so. A job of its own after the deploy, so the site still ships but the run
  # goes red. Each probe selects the table's newest column, because a column
  # the form sends but the table lacks fails every insert just the same. 401
  # is the healthy answer: table and column exist and the public role may not
  # read them. 404 (PGRST205) means the table is missing, 400 (42703) the
  # column.
  referral-table:
    name: Form tables are reachable
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Ask Supabase for public.data_referrals and public.data_partner_calls
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          url="${SUPABASE_URL:-https://zfpnlvxazrataiannvtq.supabase.co}"
          failed=0
          # table, its newest column, the form it serves, the migration
          # that adds that column (apply any earlier ones it needs first)
          while read -r table column form migration; do
            code="$(curl -s -o "/tmp/${table}.json" -w '%{http_code}' \
              "${url}/rest/v1/${table}?select=id,${column}&limit=0" \
              -H "apikey: ${SUPABASE_ANON_KEY}" \
              -H "Authorization: Bearer ${SUPABASE_ANON_KEY}")"
            if [ "$code" != "401" ]; then
              echo "::error::public.${table} (column ${column}) answered ${code}, so the ${form} form on /data-partners cannot store anything. Apply supabase/migrations/${migration} to houston-prod."
              cat "/tmp/${table}.json"
              failed=1
            else
              echo "public.${table} has ${column} (anon may insert, not read)."
            fi
          done <<'TABLES'
          data_referrals referrer_phone referral 20261109000000_data_referrals_referrer_phone.sql
          data_partner_calls page book-a-call 20261106000000_data_partner_calls.sql
          TABLES
          exit "$failed"

  deploy:
    name: Build & deploy to Firebase Hosting
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Workload Identity Federation
      actions: write # delete superseded certificate image caches
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: website/package-lock.json

      - name: Install dependencies
        working-directory: website
        run: npm ci

      - name: Unit tests
        working-directory: website
        run: npm test

      # env.js falls back to an empty posthogKey and base.njk then silently
      # omits the whole PostHog snippet, so a missing secret would ship a site
      # with no analytics and a green build. Fail loudly instead.
      - name: Fail if POSTHOG_KEY is missing
        env:
          POSTHOG_KEY: ${{ secrets.POSTHOG_KEY }}
        run: |
          if [ -z "$POSTHOG_KEY" ]; then
            echo "::error::POSTHOG_KEY secret is not set — refusing to deploy the site without analytics. Create it in Settings → Secrets and variables → Actions (public phc_ ingest token)."
            exit 1
          fi

      # Certificate images are expensive: every issued certificate is two big
      # satori + resvg canvases, and without this cache a fresh runner re-draws
      # the whole cohort on every deploy (~20 min of the run). The digest
      # manifest (website/.cache) decides staleness per attendee, but the skip
      # also requires the previously rendered PNGs to exist in _site/c, so both
      # are cached. Restore takes the newest cert-images-* entry.
      # Correctness lives in the manifest digests (attendee data + renderer
      # fingerprint), and render.mjs prunes images for certificates that are no
      # longer issued, so a stale cache can never ship a wrong or revoked image.
      #
      # The cache is ~2.2 GB against the repo's 10 GB Actions cache limit, and
      # only deploys read it, so it is the first entry GitHub evicts when CI
      # caches crowd the limit: every eviction cost a ~25 min deploy. So it is
      # saved under a hash of the manifest (no upload when no image changed)
      # and older copies are deleted, keeping exactly one.
      - name: Restore certificate image cache
        uses: actions/cache/restore@v5
        with:
          path: |
            website/.cache
            website/_site/c
          key: cert-images-${{ github.run_id }}
          restore-keys: |
            cert-images-

      - name: Build site
        working-directory: website
        run: npx @11ty/eleventy
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          WAITLIST_SHEET_ENDPOINT: ${{ secrets.WAITLIST_SHEET_ENDPOINT }}
          DATA_REFERRALS_SHEET_ENDPOINT: ${{ secrets.DATA_REFERRALS_SHEET_ENDPOINT }}
          DATA_PARTNER_CALLS_SHEET_ENDPOINT: ${{ secrets.DATA_PARTNER_CALLS_SHEET_ENDPOINT }}
          POSTHOG_KEY: ${{ secrets.POSTHOG_KEY }}
          POSTHOG_HOST: ${{ secrets.POSTHOG_HOST }}
          CERTS_EXPORT_TOKEN: ${{ secrets.CERTS_EXPORT_TOKEN }}
          CERTS_GATEWAY_URL: https://gateway.gethouston.ai

      - name: Auth to GCP
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/1056698080170/locations/global/workloadIdentityPools/github/providers/houston
          service_account: github-deploy-web@gethouston.iam.gserviceaccount.com

      - name: Deploy to Firebase Hosting
        working-directory: website
        run: >-
          npx --yes firebase-tools@15 deploy
          --only hosting:gethouston-site
          --project gethouston
          --non-interactive
          --message "${{ github.sha }}"

      # TEMPORARY dual-deploy: gethouston.ai's apex/www DNS still points at
      # Cloudflare Pages, so until the DNS flip (cutover step 4 in the header)
      # Cloudflare must keep receiving deploys or the live site goes stale.
      # DELETE this step when the DNS flip lands.
      - name: Deploy to Cloudflare Pages (until DNS flip)
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: website
          command: pages deploy _site --project-name=houston-site --branch=main

      # After both deploys, so the upload never holds up a release and a cache
      # failure never fails one.
      - name: Save certificate image cache
        id: cert-cache
        if: ${{ !cancelled() && hashFiles('website/.cache/certificate-images.json') != '' }}
        continue-on-error: true
        uses: actions/cache/save@v5
        with:
          path: |
            website/.cache
            website/_site/c
          key: cert-images-${{ hashFiles('website/.cache/certificate-images.json') }}

      # One copy, the one just saved (or found already saved): anything older
      # only crowds the cache limit.
      - name: Drop superseded certificate image caches
        if: ${{ !cancelled() && steps.cert-cache.outcome == 'success' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          KEEP: cert-images-${{ hashFiles('website/.cache/certificate-images.json') }}
        run: |
          gh cache list --repo "$GITHUB_REPOSITORY" --key cert-images- --limit 100 --json key --jq '.[].key' \
            | { grep -vxF "$KEEP" || true; } \
            | while read -r key; do gh cache delete --repo "$GITHUB_REPOSITORY" "$key"; done
