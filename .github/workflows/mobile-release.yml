name: Mobile store release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-store-release
  cancel-in-progress: false

jobs:
  ios:
    if: ${{ github.repository == 'gethouston/houston' && (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' || github.event_name == 'release' && (startsWith(github.event.release.tag_name, 'cloud-v') || startsWith(github.event.release.tag_name, 'v') && !github.event.release.prerelease)) }}
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - name: Check iOS credentials
        id: gate
        shell: bash
        env:
          VITE_CONTROL_PLANE_URL: ${{ secrets.HOSTED_ENGINE_URL != '' }}
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY != '' }}
          FIREBASE_AUTH_DOMAIN: ${{ secrets.FIREBASE_AUTH_DOMAIN != '' }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID != '' }}
          FIREBASE_APPLE_SERVICE_ID: ${{ vars.FIREBASE_APPLE_SERVICE_ID != '' }}
          POSTHOG_KEY: ${{ secrets.POSTHOG_KEY != '' }}
          POSTHOG_HOST: ${{ secrets.POSTHOG_HOST != '' }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN != '' }}
          HOUSTON_MOBILE_UPDATE_PUBKEY: ${{ secrets.HOUSTON_MOBILE_UPDATE_PUBKEY != '' }}
          HOUSTON_MOBILE_STORE_URL_IOS: ${{ vars.HOUSTON_MOBILE_STORE_URL_IOS != '' }}
          HOUSTON_MOBILE_STORE_URL_ANDROID: ${{ vars.HOUSTON_MOBILE_STORE_URL_ANDROID != '' }}
          ASC_KEY_P8_B64: ${{ secrets.ASC_KEY_P8_B64 != '' }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID != '' }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID != '' }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID != '' }}
        run: |
          missing=()
          for key in HOUSTON_MOBILE_STORE_URL_IOS VITE_CONTROL_PLANE_URL FIREBASE_API_KEY FIREBASE_AUTH_DOMAIN FIREBASE_PROJECT_ID FIREBASE_APPLE_SERVICE_ID POSTHOG_KEY POSTHOG_HOST SENTRY_DSN HOUSTON_MOBILE_UPDATE_PUBKEY ASC_KEY_P8_B64 ASC_KEY_ID ASC_ISSUER_ID APPLE_TEAM_ID; do
            if [[ "${!key}" != true ]]; then
              if [[ "$key" == VITE_CONTROL_PLANE_URL ]]; then missing+=(HOSTED_ENGINE_URL); else missing+=("$key"); fi
            fi
          done
          if (( ${#missing[@]} )); then
            echo "::notice::iOS store upload skipped; missing: ${missing[*]}"
            echo 'ready=false' >> "$GITHUB_OUTPUT"
          else
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v6
        if: steps.gate.outputs.ready == 'true'
        with:
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || github.sha }}
      - uses: pnpm/action-setup@v6
        if: steps.gate.outputs.ready == 'true'
      - uses: actions/setup-node@v6
        if: steps.gate.outputs.ready == 'true'
        with:
          node-version: 20
          cache: pnpm
      - name: Install iOS dependencies
        if: steps.gate.outputs.ready == 'true'
        run: pnpm install --frozen-lockfile
      - name: Build and sync iOS
        if: steps.gate.outputs.ready == 'true'
        shell: bash
        env:
          VITE_CONTROL_PLANE_URL: ${{ secrets.HOSTED_ENGINE_URL }}
          VITE_AGENTSTORE_GATEWAY_URL: ${{ secrets.HOSTED_ENGINE_URL }}
          VITE_CLIENT_METRICS_GATEWAY_URL: ${{ secrets.HOSTED_ENGINE_URL }}
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_AUTH_DOMAIN: ${{ secrets.FIREBASE_AUTH_DOMAIN }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_APPLE_SERVICE_ID: ${{ vars.FIREBASE_APPLE_SERVICE_ID }}
          POSTHOG_KEY: ${{ secrets.POSTHOG_KEY }}
          POSTHOG_HOST: ${{ secrets.POSTHOG_HOST }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          HOUSTON_MOBILE_UPDATE_BASE_URL: https://storage.googleapis.com/houston-mobile-updates
          HOUSTON_MOBILE_UPDATE_PUBKEY: ${{ secrets.HOUSTON_MOBILE_UPDATE_PUBKEY }}
          HOUSTON_MOBILE_STORE_URL_IOS: ${{ vars.HOUSTON_MOBILE_STORE_URL_IOS }}
          HOUSTON_MOBILE_STORE_URL_ANDROID: ${{ vars.HOUSTON_MOBILE_STORE_URL_ANDROID }}
        run: |
          set -euo pipefail
          xcodebuild -version | grep '^Xcode 26\.'
          export HOUSTON_MOBILE_BUILTIN_SEQUENCE=$((GITHUB_RUN_ID * 100 + GITHUB_RUN_ATTEMPT))
          HOUSTON_MOBILE_DEPLOY_ENV=production pnpm --filter houston-mobile sync
          build=$((GITHUB_RUN_NUMBER * 100 + GITHUB_RUN_ATTEMPT))
          test "$GITHUB_RUN_ATTEMPT" -lt 100
          test "$build" -ge "$(jq -r .required_native_build packages/mobile/native-compat.json)"
          echo "NATIVE_BUILD=$build" >> "$GITHUB_ENV"
      - name: Archive and upload to App Store Connect
        if: steps.gate.outputs.ready == 'true'
        shell: bash
        env:
          ASC_KEY_P8_B64: ${{ secrets.ASC_KEY_P8_B64 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          echo "$ASC_KEY_P8_B64" | base64 -D > "$RUNNER_TEMP/AuthKey_${ASC_KEY_ID}.p8"
          chmod 600 "$RUNNER_TEMP/AuthKey_${ASC_KEY_ID}.p8"
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <plist version="1.0"><dict><key>method</key><string>app-store-connect</string><key>destination</key><string>upload</string><key>signingStyle</key><string>automatic</string><key>teamID</key><string>${APPLE_TEAM_ID}</string></dict></plist>
          PLIST
          auth=(-authenticationKeyPath "$RUNNER_TEMP/AuthKey_${ASC_KEY_ID}.p8" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" -allowProvisioningUpdates)
          xcodebuild -project packages/mobile/ios/App/App.xcodeproj -scheme App -configuration Release -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/Houston.xcarchive" DEVELOPMENT_TEAM="$APPLE_TEAM_ID" CURRENT_PROJECT_VERSION="$NATIVE_BUILD" "${auth[@]}" archive
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/Houston.xcarchive" -exportPath "$RUNNER_TEMP/export" -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" "${auth[@]}"

  android:
    if: ${{ github.repository == 'gethouston/houston' && (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' || github.event_name == 'release' && (startsWith(github.event.release.tag_name, 'cloud-v') || startsWith(github.event.release.tag_name, 'v') && !github.event.release.prerelease)) }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check Android credentials
        id: gate
        shell: bash
        env:
          VITE_CONTROL_PLANE_URL: ${{ secrets.HOSTED_ENGINE_URL != '' }}
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY != '' }}
          FIREBASE_AUTH_DOMAIN: ${{ secrets.FIREBASE_AUTH_DOMAIN != '' }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID != '' }}
          FIREBASE_APPLE_SERVICE_ID: ${{ vars.FIREBASE_APPLE_SERVICE_ID != '' }}
          POSTHOG_KEY: ${{ secrets.POSTHOG_KEY != '' }}
          POSTHOG_HOST: ${{ secrets.POSTHOG_HOST != '' }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN != '' }}
          HOUSTON_MOBILE_UPDATE_PUBKEY: ${{ secrets.HOUSTON_MOBILE_UPDATE_PUBKEY != '' }}
          HOUSTON_MOBILE_STORE_URL_IOS: ${{ vars.HOUSTON_MOBILE_STORE_URL_IOS != '' }}
          HOUSTON_MOBILE_STORE_URL_ANDROID: ${{ vars.HOUSTON_MOBILE_STORE_URL_ANDROID != '' }}
          ANDROID_UPLOAD_KEYSTORE_B64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_B64 != '' }}
          ANDROID_UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD != '' }}
          ANDROID_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS != '' }}
          ANDROID_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD != '' }}
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON != '' }}
        run: |
          missing=()
          for key in HOUSTON_MOBILE_STORE_URL_ANDROID VITE_CONTROL_PLANE_URL FIREBASE_API_KEY FIREBASE_AUTH_DOMAIN FIREBASE_PROJECT_ID FIREBASE_APPLE_SERVICE_ID POSTHOG_KEY POSTHOG_HOST SENTRY_DSN HOUSTON_MOBILE_UPDATE_PUBKEY ANDROID_UPLOAD_KEYSTORE_B64 ANDROID_UPLOAD_KEYSTORE_PASSWORD ANDROID_UPLOAD_KEY_ALIAS ANDROID_UPLOAD_KEY_PASSWORD PLAY_SERVICE_ACCOUNT_JSON; do
            if [[ "${!key}" != true ]]; then
              if [[ "$key" == VITE_CONTROL_PLANE_URL ]]; then missing+=(HOSTED_ENGINE_URL); else missing+=("$key"); fi
            fi
          done
          if (( ${#missing[@]} )); then
            echo "::notice::Android store upload skipped; missing: ${missing[*]}"
            echo 'ready=false' >> "$GITHUB_OUTPUT"
          else
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v6
        if: steps.gate.outputs.ready == 'true'
        with:
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || github.sha }}
      - uses: pnpm/action-setup@v6
        if: steps.gate.outputs.ready == 'true'
      - uses: actions/setup-node@v6
        if: steps.gate.outputs.ready == 'true'
        with:
          node-version: 20
          cache: pnpm
      - uses: actions/setup-java@v4
        if: steps.gate.outputs.ready == 'true'
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        if: steps.gate.outputs.ready == 'true'
      - name: Install Android dependencies
        if: steps.gate.outputs.ready == 'true'
        run: pnpm install --frozen-lockfile
      - name: Build signed Android bundle
        if: steps.gate.outputs.ready == 'true'
        shell: bash
        env:
          VITE_CONTROL_PLANE_URL: ${{ secrets.HOSTED_ENGINE_URL }}
          VITE_AGENTSTORE_GATEWAY_URL: ${{ secrets.HOSTED_ENGINE_URL }}
          VITE_CLIENT_METRICS_GATEWAY_URL: ${{ secrets.HOSTED_ENGINE_URL }}
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_AUTH_DOMAIN: ${{ secrets.FIREBASE_AUTH_DOMAIN }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_APPLE_SERVICE_ID: ${{ vars.FIREBASE_APPLE_SERVICE_ID }}
          POSTHOG_KEY: ${{ secrets.POSTHOG_KEY }}
          POSTHOG_HOST: ${{ secrets.POSTHOG_HOST }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          HOUSTON_MOBILE_UPDATE_BASE_URL: https://storage.googleapis.com/houston-mobile-updates
          HOUSTON_MOBILE_UPDATE_PUBKEY: ${{ secrets.HOUSTON_MOBILE_UPDATE_PUBKEY }}
          HOUSTON_MOBILE_STORE_URL_IOS: ${{ vars.HOUSTON_MOBILE_STORE_URL_IOS }}
          HOUSTON_MOBILE_STORE_URL_ANDROID: ${{ vars.HOUSTON_MOBILE_STORE_URL_ANDROID }}
          ANDROID_UPLOAD_KEYSTORE_B64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_B64 }}
          ANDROID_UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
          ANDROID_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          ANDROID_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          export HOUSTON_MOBILE_BUILTIN_SEQUENCE=$((GITHUB_RUN_ID * 100 + GITHUB_RUN_ATTEMPT))
          HOUSTON_MOBILE_DEPLOY_ENV=production pnpm --filter houston-mobile sync
          build=$((GITHUB_RUN_NUMBER * 100 + GITHUB_RUN_ATTEMPT))
          test "$GITHUB_RUN_ATTEMPT" -lt 100
          test "$build" -ge "$(jq -r .required_native_build packages/mobile/native-compat.json)"
          echo "$ANDROID_UPLOAD_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/houston-upload.keystore"
          export HOUSTON_NATIVE_BUILD_NUMBER="$build"
          export ANDROID_UPLOAD_KEYSTORE_PATH="$RUNNER_TEMP/houston-upload.keystore"
          cd packages/mobile/android
          ./gradlew bundleRelease
      - name: Upload to Play internal track
        if: steps.gate.outputs.ready == 'true'
        uses: r0adkll/upload-google-play@eb49699984a39f23558439581660aa6f088acfd6 # v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: ai.gethouston.app
          releaseFiles: packages/mobile/android/app/build/outputs/bundle/release/app-release.aab
          tracks: internal
          status: completed
