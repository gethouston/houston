# TEMPORARY diagnostic — runs scripts/ci/verify-windows-upgrade.ps1 exactly as
# release.yml does, against the published cloud-v0.6.18 MSI (baseline resolves
# to cloud-v0.6.17). Delete before merging.
name: Windows upgrade probe
on:
  push:
    branches: [fix/windows-upgrade-verify]
    paths: [".github/workflows/windows-upgrade-probe.yml", "scripts/ci/verify-windows-upgrade.ps1"]
permissions:
  contents: read
jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64, runner: windows-latest, pattern: "*_x64_*.msi" }
          - { arch: aarch64, runner: windows-11-arm, pattern: "*_arm64_*.msi" }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Download the installer under test
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release download cloud-v0.6.18 --repo $env:GITHUB_REPOSITORY --pattern '${{ matrix.pattern }}' --dir "$env:RUNNER_TEMP\under-test"
      - name: Verify upgrade removes retired client and preserves saved settings
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REF_NAME: cloud-v0.6.18
        run: |
          $msi = (Get-ChildItem "$env:RUNNER_TEMP\under-test" -Filter *.msi)[0].FullName
          ./scripts/ci/verify-windows-upgrade.ps1 -Installer $msi -Architecture "${{ matrix.arch }}"
