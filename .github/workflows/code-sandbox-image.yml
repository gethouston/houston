# Code Sandbox Image — build + push to Artifact Registry
#
# The code sandbox (`packages/code-sandbox`) is the disposable box where an
# agent's UNTRUSTED code runs: a stateless HTTP service on Cloud Run (gen2,
# --concurrency=1). This repo is its single source of truth.
#
# This workflow ONLY builds and publishes the image. It does NOT touch Cloud Run
# or the cluster: this repo is public, and a compromised third-party Action or
# dependency here must not be able to reach production. The actual deploy (roll
# the Cloud Run revision, point the gateway's `/v1/code/run` relay at it) happens
# in the private gethouston/cloud repo, triggered by the repository_dispatch
# fired below. That handoff is the trust boundary.
#
# Two triggers, two audiences:
#   - push to main (paths-filtered in "Determine whether to build" below):
#     continuous build → dispatches code-sandbox-published → cloud deploys the
#     staging sandbox.
#   - push of a code-sandbox-v* tag (no path filter — the tag means "ship this",
#     and combining paths with a tags trigger is unreliable in GitHub Actions,
#     since a tag push often carries no commit list to diff against):
#     dispatches code-sandbox-published-prod → cloud deploys prod.
# The tag pattern is deliberately NARROW: this repo's tag namespace already
# carries other release trains — v*/cloud-v* (desktop, release.yml),
# cloud-latest (a MOVING pointer that gets re-pushed), ios-v* (TestFlight),
# engine-v* (self-host host binary), engine-pod-v* (the engine fleet). Each
# train versions independently; only code-sandbox-v* may ship the sandbox.
# The path-relevance check for the main-branch case lives in the step below
# rather than in the `on:` trigger, since GitHub Actions applies one `paths:`
# filter to the whole push trigger regardless of which ref pattern (branches vs
# tags) matched — it can't be tag-exempt at the trigger level.
#
# Publishes two tags per build:
#   code-sandbox:<git-sha>  — immutable, by-digest reference used for the deploy.
#   code-sandbox:latest     — moving pointer to the newest build (convenience).
#
# ── GCP auth: Workload Identity Federation ────────────────────────────────────
#   SA: github-deploy-engine@gethouston.iam.gserviceaccount.com — Artifact Registry
#   Writer ONLY (no cluster role), the same SA engine-pod-image.yml uses. The WIF
#   provider condition must restrict this binding to
#   attribute.repository=='gethouston/houston' — do NOT reuse the broader
#   github-deploy@gethouston.iam.gserviceaccount.com SA used by cloud's
#   workflows, which also carries Kubernetes Engine Developer.
#
# ── Required GitHub secret ─────────────────────────────────────────────────────
#   CLOUD_DISPATCH_TOKEN — fine-grained PAT scoped ONLY to gethouston/cloud, with
#   the minimum permission GitHub requires for the repository_dispatch endpoint.
#   Used solely to notify cloud that a new image is ready; carries no GCP access.

name: Code Sandbox Image

on:
  push:
    branches: [main]
    tags: ["code-sandbox-v*"]
  workflow_dispatch:

concurrency:
  group: code-sandbox-image
  cancel-in-progress: false

env:
  GCP_PROJECT: gethouston
  REGION: us-east1
  REGISTRY: us-east1-docker.pkg.dev/gethouston/houston

jobs:
  build:
    name: Build & push code-sandbox
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write # Workload Identity Federation

    steps:
      - uses: actions/checkout@v4

      # A code-sandbox-v* tag or a manual dispatch always builds (the tag IS
      # the release decision; no other tag pattern reaches this workflow).
      # A push to main only builds when it touched a relevant path.
      #
      # Diffs github.event.before (main's tip BEFORE this push) against the new
      # HEAD, NOT just HEAD^ — a single push can carry several commits (e.g. a
      # non-squash merge), and diffing only the last commit against its
      # immediate parent would miss relevant paths touched by an EARLIER commit
      # in the same push. `before` isn't guaranteed to be present in the shallow
      # clone actions/checkout leaves behind, so it's fetched on demand; if that
      # fetch fails (or before is the all-zeros SHA GitHub sends for a branch's
      # first-ever push), fail open and build anyway — a wasted build is cheap,
      # a silently skipped release isn't.
      - name: Determine whether to build
        id: gate
        run: |
          if [ "${{ github.ref_type }}" = "tag" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          BASE="${{ github.event.before }}"
          BUILD=true
          if [ -n "$BASE" ] && [ "$BASE" != "0000000000000000000000000000000000000000" ] \
              && git fetch --depth=1 origin "$BASE" 2>/dev/null; then
            if git diff --name-only "$BASE" "${{ github.sha }}" -- \
                packages/code-sandbox pnpm-lock.yaml pnpm-workspace.yaml \
                patches .github/workflows/code-sandbox-image.yml | grep -q .; then
              BUILD=true
            else
              BUILD=false
            fi
          fi
          echo "build=$BUILD" >> "$GITHUB_OUTPUT"

      - name: Auth to GCP
        if: steps.gate.outputs.build == 'true'
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/1056698080170/locations/global/workloadIdentityPools/github/providers/houston
          service_account: github-deploy-engine@gethouston.iam.gserviceaccount.com

      - name: Set up gcloud
        if: steps.gate.outputs.build == 'true'
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        if: steps.gate.outputs.build == 'true'
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Build & push code-sandbox
        id: build
        if: steps.gate.outputs.build == 'true'
        run: |
          set -euo pipefail
          SHA_TAG="${{ env.REGISTRY }}/code-sandbox:${{ github.sha }}"
          LATEST_TAG="${{ env.REGISTRY }}/code-sandbox:latest"
          # Build context is the MONOREPO ROOT: the Dockerfile copies the
          # workspace manifests, patches/ and the package itself.
          docker build \
            --platform linux/amd64 \
            -f packages/code-sandbox/Dockerfile \
            -t "$SHA_TAG" -t "$LATEST_TAG" \
            .
          docker push "$SHA_TAG"
          docker push "$LATEST_TAG"
          # Resolve the immutable digest of the pushed image for the deploy below.
          DIGEST=$(gcloud artifacts docker images describe "$SHA_TAG" \
            --format='value(image_summary.digest)')
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"

      - name: Published tags
        if: steps.gate.outputs.build == 'true'
        run: |
          echo "Published:"
          echo "  ${{ env.REGISTRY }}/code-sandbox:${{ github.sha }}"
          echo "  ${{ env.REGISTRY }}/code-sandbox:latest"
          echo "  digest ${{ steps.build.outputs.digest }}"

      # Notify cloud that a new code-sandbox image is ready — cloud owns the
      # Cloud Run and gateway credentials and performs the actual deploy. A tag
      # push notifies prod (code-sandbox-published-prod); a push to main
      # notifies staging (code-sandbox-published). A workflow_dispatch on a
      # debug branch just publishes the image.
      - name: Notify cloud repo
        if: steps.gate.outputs.build == 'true' && (github.ref_type == 'tag' || github.ref == 'refs/heads/main')
        env:
          GH_TOKEN: ${{ secrets.CLOUD_DISPATCH_TOKEN }}
        run: |
          IMAGE="${{ env.REGISTRY }}/code-sandbox@${{ steps.build.outputs.digest }}"
          EVENT_TYPE="code-sandbox-published"
          [ "${{ github.ref_type }}" = "tag" ] && EVENT_TYPE="code-sandbox-published-prod"
          gh api repos/gethouston/cloud/dispatches \
            -f event_type="$EVENT_TYPE" \
            -F "client_payload[digest]=${{ steps.build.outputs.digest }}" \
            -F "client_payload[image]=$IMAGE" \
            -F "client_payload[sha]=${{ github.sha }}"
