# Fails a pull request whose commits add an API key, token or private key.
# Only the PR's own commits are scanned, so anything already in history does
# not block unrelated PRs. A false positive is silenced with a trailing
# `gitleaks:allow` comment on the line, or by adding the finding's
# fingerprint (printed in the log) to `.gitleaksignore`.
#
# The gitleaks binary is pinned by checksum instead of using gitleaks-action,
# which needs a paid license on organization repos.

name: Credential scan

on:
  pull_request:
    branches: [main]

concurrency:
  group: credential-scan-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GITLEAKS_VERSION: 8.30.1
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb

jobs:
  gitleaks:
    name: Credential scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Full history so `base..head` excludes exactly what main already has,
      # including commits a branch merged in from main. Blobs load on demand,
      # so only the scanned commits' files are downloaded.
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          filter: blob:none

      - name: Install gitleaks
        run: |
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSLo "$RUNNER_TEMP/$tarball" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$tarball"
          echo "$GITLEAKS_SHA256  $RUNNER_TEMP/$tarball" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP" gitleaks

      # --redact keeps the matched value out of the job log.
      - name: Scan the PR's commits
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          "$RUNNER_TEMP/gitleaks" git --redact --no-banner --verbose \
            --log-opts="${BASE_SHA}..HEAD" .
