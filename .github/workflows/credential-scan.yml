# Fails a pull request whose commits add an API key, token or private key.
# Only the PR's own commits are scanned, so anything already in history does
# not block unrelated PRs. Known false positives live in `.gitleaks.toml`.
# A one-off can also take a trailing `gitleaks:allow` comment on the line.
#
# The gitleaks binary is pinned by checksum instead of using gitleaks-action,
# which needs a license key on organization repos.

name: Credential scan

on:
  pull_request:
    branches: [main]
    # `edited` covers a stacked PR retargeted to main.
    types: [opened, synchronize, reopened, edited]

# No cancel-in-progress: a commit that is pushed and then force-pushed away
# within seconds still gets its own completed scan.

permissions:
  contents: read

env:
  GITLEAKS_VERSION: 8.30.1
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb

jobs:
  gitleaks:
    name: Credential scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Full history, blobs included, so `base..head` excludes exactly what
      # main already has. A blobless clone would fetch blobs one at a time
      # during the scan, and gitleaks reports a failed `git log` as a clean run.
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSLo "$RUNNER_TEMP/$tarball" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$tarball"
          echo "$GITLEAKS_SHA256  $RUNNER_TEMP/$tarball" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP" gitleaks

      # gitleaks exits 0 when `git log` fails, so the same log runs first and
      # fails the job on its own. --remerge-diff shows what a merge commit
      # changed beyond a clean merge (conflict resolutions), which plain
      # `log -p` skips. The log prints only rule, file, line and commit:
      # --verbose output carries the text around each match, which can hold
      # part of a second key on the same line.
      - name: Scan the PR's commits
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          git log -p --remerge-diff "${BASE_SHA}..HEAD" > /dev/null
          report="$RUNNER_TEMP/gitleaks.json"
          status=0
          "$RUNNER_TEMP/gitleaks" git --redact --no-banner \
            --report-format json --report-path "$report" \
            --log-opts="--remerge-diff ${BASE_SHA}..HEAD" . || status=$?
          if [ -s "$report" ]; then
            jq -r '.[] | "::error file=\(.File),line=\(.StartLine)::\(.RuleID) in commit \(.Commit[0:12])"' "$report"
          fi
          exit "$status"
