# Ship train — publishing the cloud draft is THE ship button.
#
# THE TRAIN (one version, every piece):
#   1. CUT (daily-cloud-cut.yml, 12:45 UTC Mon–Fri) — tag `cloud-v<version>`.
#   2. DRAFT (release.yml) — prod + staging DMGs on a draft PRERELEASE; the
#      staging engine fleet already runs the current main engine (it rolls on
#      every merge), so staging DMG + staging engine = the exact 0.5.N pairing.
#   3. QA — the team tests the staging DMG in the 08:30 (Bogotá) daily.
#   4. PUBLISH (human, one click) — and everything ships together:
#        · cloud-updater-manifest.yml flips the `cloud-latest` pointer, so
#          every desktop auto-updates to the new app.
#        · THIS workflow promotes the prod ENGINE fleet to the same train and
#          stamps the version label. Before this file existed, the engine roll
#          was a separate manual `engine-pod-v*` tag push that people forgot,
#          so prod engine drifted behind the app for days.
#        · THIS workflow also promotes the prod AGENT STORE web
#          (agents.gethouston.ai) to the same train. Same lesson, second
#          surface: the store's prod roll used to require a separate manual
#          `agentstore-v*` tag push that nobody made, so the public site sat
#          two weeks behind staging (Jul→Aug 2026).
#        · THIS workflow then records `train.json` on the release (see below).
#
# WHAT "SAME TRAIN" MEANS FOR THE ENGINE:
#   Engine images build per engine-touching merge (engine-pod-image.yml is
#   paths-filtered), so the engine of train `cloud-v<V>` is the NEWEST
#   `engine-pod:<sha>` at-or-before the release's base commit. We find it by
#   walking the FIRST-PARENT chain from the release commit's parent (the main
#   tip the train was cut from) and probing Artifact Registry for each sha —
#   first hit wins. First-parent only: side-branch commits never had images
#   built for their own shas, and walking them would probe noise.
#
# SEQ = EPOCH SECONDS: cloud's roll-engine.yml skips any dispatch whose seq is
#   <= the stored `engine-image-seq` (out-of-order guard). Both this workflow
#   and engine-pod-image.yml fire prod dispatches, and their run_numbers are
#   incomparable across workflows — so every sender uses epoch seconds, which
#   stay monotonic no matter who sends. The payload KEY stays `run_number`
#   (cloud reads client_payload.run_number).
#
# train.json IS THE RECORD OF WHAT SHIPPED: the `record` job uploads it to the
#   published release (asset `train.json`, GITHUB_TOKEN + contents: write, no
#   ref push involved). It maps the train to the engine and agentstore images
#   (sha, digest, image ref) that were promoted, and says whether each label
#   below could be stamped, and whether each prod dispatch went out. Read it
#   first when asking "what did train X.Y.Z ship?"; the labels are a
#   convenience view of the same facts. Schema is additive
#   (`schema: 1`); scripts/ci/write-train-json.sh renders it.
#
# THE VERSION LABELS ARE LABELS, NOT TRIGGERS: `label/engine-pod-v<version>`
#   and `label/agentstore-v<version>` are pushed with the default GITHUB_TOKEN,
#   whose pushes deliberately do NOT trigger other workflows (GitHub's
#   recursive-workflow guard), so stamping a label can never rebuild or re-roll
#   anything. They exist so humans get one version namespace: "train 0.5.24"
#   names the app AND the engine it shipped with.
#   They live under `label/` because `engine-pod-v*` and `agentstore-v*` are
#   deploy tags. A repo tag ruleset lets only admins create those, and GitHub
#   Actions cannot be a ruleset bypass actor, so GITHUB_TOKEN can't stamp them.
#   `label/` must stay outside every deploy namespace (the release-tokens
#   environment's tag patterns, cloud's WIF release-tag prefixes), so a label a
#   branch workflow forges grants nothing. Trains up to 1.0.5 carry the old
#   `engine-pod-v<version>` / `agentstore-v<version>` labels.
#   A LABEL CAN BE REFUSED, AND THAT NEVER FAILS THE TRAIN: GITHUB_TOKEN has no
#   `workflows` permission, and GitHub rejects a ref push whose target commit's
#   .github/workflows/* differ from the default branch's. The agentstore image
#   commit is usually older than main (store builds are sparse), so its label
#   trips this whenever a workflow changed since; the engine label can too.
#   scripts/ci/stamp-train-label.sh turns every refusal into a ::warning:: and
#   records the outcome in train.json. 1.0.6 shipped with this refusal and a
#   red run (label/agentstore-v1.0.6 was never created), hence the rule.
#   Pushing an `engine-pod-v*` tag by hand (admins only; a real user push DOES
#   trigger engine-pod-image.yml's tag path) remains the break-glass prod
#   engine roll, independent of any release. A hand-pushed agentstore-v* tag
#   (agentstore-image.yml's tag path → roll-agentstore-prod) remains the
#   break-glass prod store roll.
#
# OUT OF SCOPE (deliberately): the prod gateway/control-plane (gethouston/cloud
#   repo) deploys on its own release tag and is not yet part of this train.

name: Ship train

on:
  release:
    types: [published]

permissions:
  contents: write # the label/* version tag pushes and the train.json release asset (GITHUB_TOKEN, non-triggering)
  id-token: write # Workload Identity Federation (Artifact Registry probe)

concurrency:
  group: ship-train
  cancel-in-progress: false

env:
  REGISTRY: us-east1-docker.pkg.dev/gethouston/houston

jobs:
  promote:
    # Reads RELEASE_CUT_TOKEN / CLOUD_DISPATCH_TOKEN from this environment, which
    # admits main and the release tag patterns only (no feature-branch dispatch).
    environment: release-tokens
    # Cloud channel drafts only: local `v*` and manual `engine-pod-v*` release
    # publishes are not trains, and `cloud-latest` is the machine-managed
    # updater pointer (cloud- prefixed but never a train).
    if: >-
      startsWith(github.event.release.tag_name, 'cloud-v') &&
      github.event.release.tag_name != 'cloud-latest'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.engine.outputs.version }}
      base_sha: ${{ steps.engine.outputs.base_sha }}
      train_sha: ${{ steps.engine.outputs.train_sha }}
      digest: ${{ steps.engine.outputs.digest }}
      dispatched: ${{ steps.dispatch.outputs.dispatched }}
      label_stamped: ${{ steps.label.outputs.stamped }}
      label_reason: ${{ steps.label.outputs.reason }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Auth to GCP
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/1056698080170/locations/global/workloadIdentityPools/github/providers/houston
          service_account: github-deploy-engine@gethouston.iam.gserviceaccount.com

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3

      # The release commit's FIRST PARENT is the main tip the train was cut
      # from (the release commit itself lives only under the tag). Walk that
      # first-parent chain for the newest sha with a published engine image.
      - name: Resolve the train's engine image
        id: engine
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          VERSION="${TAG#cloud-v}"
          BASE_SHA=$(git rev-parse "${TAG}^")
          echo "Train ${VERSION}: base commit ${BASE_SHA}"

          TRAIN_SHA=""
          DIGEST=""
          for sha in $(git log --first-parent --format=%H -n 100 "$BASE_SHA"); do
            if DIGEST=$(gcloud artifacts docker images describe \
                "${REGISTRY}/engine-pod:${sha}" \
                --format='value(image_summary.digest)' 2>/dev/null); then
              TRAIN_SHA="$sha"
              break
            fi
          done

          if [ -z "$TRAIN_SHA" ] || [ -z "$DIGEST" ]; then
            echo "::error::No engine-pod image found in the last 100 first-parent commits before ${BASE_SHA}. Something is wrong with engine-pod-image.yml — investigate before shipping; do not guess an image."
            exit 1
          fi

          echo "Train engine: engine-pod:${TRAIN_SHA} (${DIGEST})"
          {
            echo "version=${VERSION}"
            echo "base_sha=${BASE_SHA}"
            echo "train_sha=${TRAIN_SHA}"
            echo "digest=${DIGEST}"
          } >> "$GITHUB_OUTPUT"

      # Fire the prod roll — the same repository_dispatch contract
      # engine-pod-image.yml's tag path uses (cloud/roll-engine.yml consumes
      # it: ConfigMap write, converge ticker rolls the fleet busy-aware).
      - name: Promote prod engine fleet
        id: dispatch
        env:
          GH_TOKEN: ${{ secrets.CLOUD_DISPATCH_TOKEN }}
          VERSION: ${{ steps.engine.outputs.version }}
          TRAIN_SHA: ${{ steps.engine.outputs.train_sha }}
          DIGEST: ${{ steps.engine.outputs.digest }}
        run: |
          set -euo pipefail
          IMAGE="${REGISTRY}/engine-pod@${DIGEST}"
          gh api repos/gethouston/cloud/dispatches \
            -f event_type='engine-pod-published-prod' \
            -F "client_payload[digest]=${DIGEST}" \
            -F "client_payload[image]=$IMAGE" \
            -F "client_payload[sha]=${TRAIN_SHA}" \
            -F "client_payload[run_number]=$(date +%s)"
          echo "dispatched=true" >> "$GITHUB_OUTPUT"
          echo "::notice::Prod engine promotion dispatched for train ${VERSION} (${IMAGE})"

      # Version label: label/engine-pod-v<version> at the train's engine sha.
      # Pushed with GITHUB_TOKEN so it can never trigger a build (see header).
      # The script never fails the train: a re-publish at the same sha is a
      # no-op, a label pointing ELSEWHERE is left alone with a warning (a
      # train's label never silently moves), and a refused push is a warning.
      # Its outcome lands in train.json.
      - name: Stamp engine version label
        id: label
        env:
          VERSION: ${{ steps.engine.outputs.version }}
          TRAIN_SHA: ${{ steps.engine.outputs.train_sha }}
        run: |
          scripts/ci/stamp-train-label.sh "label/engine-pod-v${VERSION}" "$TRAIN_SHA" \
            "Houston train ${VERSION} — engine label (app tag cloud-v${VERSION})"

      - name: Summary
        env:
          VERSION: ${{ steps.engine.outputs.version }}
          TRAIN_SHA: ${{ steps.engine.outputs.train_sha }}
          DIGEST: ${{ steps.engine.outputs.digest }}
          LABEL_STAMPED: ${{ steps.label.outputs.stamped }}
        run: |
          echo "::notice::Train ${VERSION} shipped: desktop updater flipped by cloud-updater-manifest.yml, prod engine rolling to engine-pod@${DIGEST} (sha ${TRAIN_SHA}), label label/engine-pod-v${VERSION} stamped=${LABEL_STAMPED}."

  promote-agentstore:
    # Reads RELEASE_CUT_TOKEN / CLOUD_DISPATCH_TOKEN from this environment, which
    # admits main and the release tag patterns only (no feature-branch dispatch).
    environment: release-tokens
    # Same gate as promote: cloud channel drafts only.
    if: >-
      startsWith(github.event.release.tag_name, 'cloud-v') &&
      github.event.release.tag_name != 'cloud-latest'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.agentstore.outputs.version }}
      base_sha: ${{ steps.agentstore.outputs.base_sha }}
      train_sha: ${{ steps.agentstore.outputs.train_sha }}
      digest: ${{ steps.agentstore.outputs.digest }}
      dispatched: ${{ steps.dispatch.outputs.dispatched }}
      label_stamped: ${{ steps.label.outputs.stamped }}
      label_reason: ${{ steps.label.outputs.reason }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Auth to GCP
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/1056698080170/locations/global/workloadIdentityPools/github/providers/houston
          service_account: github-deploy-engine@gethouston.iam.gserviceaccount.com

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3

      # Same newest-image-at-or-before-base rule as the engine, different
      # search: agentstore builds are paths-filtered and SPARSE (the store can
      # go untouched for weeks — the newest image sat 225 first-parent commits
      # behind the Aug 2026 train base), so the engine's probe-per-sha loop
      # with its 100-commit horizon would miss it. Instead: ONE registry call
      # lists every sha-tagged agentstore image, then the first-parent walk
      # intersects locally — deep history costs nothing extra.
      - name: Resolve the train's agentstore image
        id: agentstore
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          VERSION="${TAG#cloud-v}"
          BASE_SHA=$(git rev-parse "${TAG}^")
          echo "Train ${VERSION}: base commit ${BASE_SHA}"

          # `|| true`: zero sha tags must fall through to the curated error
          # below, not die opaquely on pipefail at the grep.
          gcloud artifacts docker images list "${REGISTRY}/agentstore" \
            --include-tags --format='value(tags)' \
            | { tr ',' '\n' | grep -E '^[0-9a-f]{40}$' || true; } | sort -u > /tmp/agentstore-shas

          TRAIN_SHA=""
          for sha in $(git log --first-parent --format=%H -n 1000 "$BASE_SHA"); do
            if grep -qx "$sha" /tmp/agentstore-shas; then
              TRAIN_SHA="$sha"
              break
            fi
          done

          if [ -z "$TRAIN_SHA" ]; then
            echo "::error::No agentstore image found in the last 1000 first-parent commits before ${BASE_SHA}. Something is wrong with agentstore-image.yml — investigate before shipping; do not guess an image."
            exit 1
          fi

          DIGEST=$(gcloud artifacts docker images describe \
            "${REGISTRY}/agentstore:${TRAIN_SHA}" \
            --format='value(image_summary.digest)')

          echo "Train agentstore: agentstore:${TRAIN_SHA} (${DIGEST})"
          {
            echo "version=${VERSION}"
            echo "base_sha=${BASE_SHA}"
            echo "train_sha=${TRAIN_SHA}"
            echo "digest=${DIGEST}"
          } >> "$GITHUB_OUTPUT"

      # Same repository_dispatch contract agentstore-image.yml's tag path uses
      # (cloud/roll-agentstore.yml consumes it: kubectl set image + rollout
      # status). No seq guard on that side — set-image to an unchanged digest
      # is a no-op, so a re-published release re-dispatching is harmless.
      # run_number is informational there; epoch seconds keeps it monotonic
      # alongside this workflow's engine dispatch.
      - name: Promote prod agentstore web
        id: dispatch
        env:
          GH_TOKEN: ${{ secrets.CLOUD_DISPATCH_TOKEN }}
          VERSION: ${{ steps.agentstore.outputs.version }}
          TRAIN_SHA: ${{ steps.agentstore.outputs.train_sha }}
          DIGEST: ${{ steps.agentstore.outputs.digest }}
        run: |
          set -euo pipefail
          IMAGE="${REGISTRY}/agentstore@${DIGEST}"
          gh api repos/gethouston/cloud/dispatches \
            -f event_type='roll-agentstore-prod' \
            -F "client_payload[digest]=${DIGEST}" \
            -F "client_payload[image]=$IMAGE" \
            -F "client_payload[sha]=${TRAIN_SHA}" \
            -F "client_payload[run_number]=$(date +%s)"
          echo "dispatched=true" >> "$GITHUB_OUTPUT"
          echo "::notice::Prod agentstore promotion dispatched for train ${VERSION} (${IMAGE})"

      # Version label: label/agentstore-v<version> at the train's agentstore sha.
      # Same rules as the engine label (GITHUB_TOKEN push, never triggers the
      # tag build, never fails the train). This is the label GitHub refuses
      # most often: the store image commit sits behind main, so any workflow
      # change since makes the push a "workflow update" the token may not do.
      - name: Stamp agentstore version label
        id: label
        env:
          VERSION: ${{ steps.agentstore.outputs.version }}
          TRAIN_SHA: ${{ steps.agentstore.outputs.train_sha }}
        run: |
          scripts/ci/stamp-train-label.sh "label/agentstore-v${VERSION}" "$TRAIN_SHA" \
            "Houston train ${VERSION} — agentstore label (app tag cloud-v${VERSION})"

      - name: Summary
        env:
          VERSION: ${{ steps.agentstore.outputs.version }}
          TRAIN_SHA: ${{ steps.agentstore.outputs.train_sha }}
          DIGEST: ${{ steps.agentstore.outputs.digest }}
          LABEL_STAMPED: ${{ steps.label.outputs.stamped }}
        run: |
          echo "::notice::Train ${VERSION}: agents.gethouston.ai rolling to agentstore@${DIGEST} (sha ${TRAIN_SHA}), label label/agentstore-v${VERSION} stamped=${LABEL_STAMPED}."

  # The durable record (see header). Runs after both promotions whatever their
  # result (not on cancel): a half whose image never resolved is `null`, a
  # half whose dispatch step failed reads dispatched=false (job outputs survive
  # a failed job, so the resolved sha alone is not proof of a roll), and a
  # refused label shows as stamped=false with the remote's reason, so the
  # asset always says what this run actually did. No environment, no ref push.
  record:
    needs: [promote, promote-agentstore]
    if: >-
      !cancelled() &&
      startsWith(github.event.release.tag_name, 'cloud-v') &&
      github.event.release.tag_name != 'cloud-latest'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Job-level so the inherited id-token: write is dropped here: this job
    # only uploads an asset with GITHUB_TOKEN, it never talks to GCP.
    permissions:
      contents: write # gh release upload the train.json asset
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Write train.json
        env:
          TAG: ${{ github.event.release.tag_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          BASE_SHA: ${{ needs.promote.outputs.base_sha || needs.promote-agentstore.outputs.base_sha }}
          ENGINE_SHA: ${{ needs.promote.outputs.train_sha }}
          ENGINE_DIGEST: ${{ needs.promote.outputs.digest }}
          ENGINE_DISPATCHED: ${{ needs.promote.outputs.dispatched }}
          ENGINE_LABEL_STAMPED: ${{ needs.promote.outputs.label_stamped }}
          ENGINE_LABEL_REASON: ${{ needs.promote.outputs.label_reason }}
          AGENTSTORE_SHA: ${{ needs.promote-agentstore.outputs.train_sha }}
          AGENTSTORE_DIGEST: ${{ needs.promote-agentstore.outputs.digest }}
          AGENTSTORE_DISPATCHED: ${{ needs.promote-agentstore.outputs.dispatched }}
          AGENTSTORE_LABEL_STAMPED: ${{ needs.promote-agentstore.outputs.label_stamped }}
          AGENTSTORE_LABEL_REASON: ${{ needs.promote-agentstore.outputs.label_reason }}
        run: |
          set -euo pipefail
          VERSION="${TAG#cloud-v}" scripts/ci/write-train-json.sh train.json
          cat train.json

      # `--clobber`: a re-published release re-records over the previous asset.
      # Asset uploads are not release events, and GITHUB_TOKEN never triggers
      # workflows anyway, so this cannot re-fire cloud-updater-manifest.yml.
      - name: Upload train.json to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          gh release upload "$TAG" train.json --clobber -R "$GITHUB_REPOSITORY"
          echo "::notice::train.json recorded on https://github.com/${GITHUB_REPOSITORY}/releases/tag/${TAG}"
