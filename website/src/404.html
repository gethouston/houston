<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<meta name="robots" content="noindex"/>
<title>Page not found | Houston</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg"/>
<style>
  :root{ --bg:#ffffff; --ink:#0d0d0d; --muted:#5d5d5d; --border:#e5e5e5; }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:var(--bg);color:var(--ink);font-family:"General Sans","SF Pro Display",-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;-webkit-font-smoothing:antialiased}
  .wrap{max-width:520px}
  .code{font-size:14px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
  h1{font-size:42px;font-weight:700;letter-spacing:-.03em;margin-top:14px;line-height:1.1}
  p{font-size:17px;color:var(--muted);margin-top:14px;line-height:1.5}
  .btn{display:inline-block;margin-top:28px;padding:12px 26px;border-radius:999px;background:var(--ink);color:#fff;text-decoration:none;font-weight:600;font-size:15px}
  .links{margin-top:22px;font-size:14px}
  .links a{color:var(--ink);margin:0 10px;text-decoration:none;border-bottom:1px solid var(--border)}
</style>
</head>
<body>
  <main class="wrap">
    <div class="code">Error 404</div>
    <h1>We could not find that page.</h1>
    <p>The link may be broken or the page may have moved. Let's get you back to work.</p>
    <a class="btn" href="/">Back to Houston</a>
    <div class="links">
      <a href="/startups/">For Startups</a>
      <a href="/changelog/">Changelog</a>
      <a href="/#download">Download Houston</a>
    </div>
  </main>
  <script>
    // A 404 on a certificate share link (/c/<CODE>) is never really "page not
    // found" — it is a case-mangled link or a certificate issued since the last
    // deploy. Both have an answer; the generic copy above has none.
    (function () {
      var match = /^\/c\/([a-zA-Z0-9-]+)((?:\.og)?\.png)?$/.exec(location.pathname);
      if (!match) return;
      var code = match[1].toUpperCase();

      // 1. Codes get typed and pasted in lowercase, but /c/ is case-sensitive
      //    on both Firebase Hosting and Cloudflare Pages. Retry in the
      //    canonical form. This cannot loop and needs no flag to prove it: the
      //    retry URL is already uppercase, so a second visit fails this test
      //    and falls through. (A sessionStorage guard here used to make every
      //    repeat visit to a working lowercase link dead-end on this page.)
      if ("/c/" + code + (match[2] || "") !== location.pathname) {
        location.replace("/c/" + code + (match[2] || "") + location.search + location.hash);
        return;
      }

      // 2. The canonical URL really has no page. If the code is well formed,
      //    the certificate probably exists and simply predates no deploy —
      //    send them to the verifier, which resolves it live from the gateway.
      if (!/^HOU-[A-Z0-9]{5}-[A-Z0-9]{5}$/.test(code)) return;
      var wrap = document.querySelector(".wrap");
      var h1 = wrap.querySelector("h1");
      var lead = wrap.querySelector("p");
      var btn = wrap.querySelector(".btn");
      var links = wrap.querySelector(".links");
      h1.textContent = "We could not find that certificate page.";
      lead.textContent =
        "It may have been issued after our last update. Check the code against Houston's records — it takes a second.";
      btn.textContent = "Verify this certificate";
      btn.href = "/certificates/verify/?code=" + encodeURIComponent(code);
      links.textContent = "";
      var es = document.createElement("a");
      es.href = "/certificates/verify/?code=" + encodeURIComponent(code);
      es.lang = "es";
      es.textContent = "Comprueba tu certificado";
      links.appendChild(es);
      var mine = document.createElement("a");
      mine.href = "/certificates/";
      mine.textContent = "Get your certificate";
      links.appendChild(mine);
      var home = document.createElement("a");
      home.href = "/";
      home.textContent = "Back to Houston";
      links.appendChild(home);
    })();
  </script>
</body>
</html>
