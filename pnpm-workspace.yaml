packages:
  - "ui/*"
  - "app"
  - "packages/*"
  - "agentstore"

# Approve native build scripts (pnpm 10 blocks dependency postinstall by
# default). @sentry/cli's postinstall downloads the platform `sentry-cli`
# binary that `app/scripts/sentry-inject.mjs` + the release.yml Sentry upload
# steps invoke. Lives here, NOT in package.json's `pnpm` field — recent pnpm no
# longer reads that field ("The pnpm field in package.json is no longer read").
onlyBuiltDependencies:
  - "@sentry/cli"

# Security override (uuid <11.1.1 advisory): gaxios 6 and teeny-request 9
# (both pulled by @google-cloud/storage, which has no gaxios-7-based release
# yet) declare uuid ^9. Both only call the still-present `v4()` (multipart
# boundaries), so forcing the patched major is safe. Drop when
# @google-cloud/storage moves to gaxios >=7 (which dropped uuid entirely).
overrides:
  "gaxios>uuid": "^11.1.1"
  "teeny-request>uuid": "^11.1.1"
  # Security floor for transitive dependencies whose parents pin a vulnerable
  # version (Dependabot cannot update these). Each stays within the major its
  # parent expects, except tar 6 and uuid 7, which only @capacitor/assets'
  # mobile asset tooling uses. Drop an entry once its parent ships the fix.
  "dompurify@<3.4.17": "3.4.17"
  "markdown-it@<14.3.3": "14.3.3"
  "mermaid@<11.16.1": "^11.17.2"
  "katex@<0.18.2": "^0.18.11"
  "prosemirror-view@<1.42.3": "^1.42.8"
  "toml@<5.0.1": "5.0.1"
  "typeorm@<0.3.31": "0.3.31"
  "js-yaml@>=4 <4.3.2": "4.3.2"
  "fast-uri@<3.1.9": "3.1.9"
  "fast-xml-parser@<5.10.1": "^5.11.2"
  "browserslist@<4.28.7": "^4.29.4"
  "baseline-browser-mapping@<2.11.0": "^2.11.32"
  "postcss@<8.5.23": "^8.5.31"
  "brace-expansion@>=2 <2.1.7": "2.1.7"
  "@sentry/cli>undici": "6.29.1"
  "jsdom>undici": "7.30.1"
  "@earendil-works/pi-coding-agent>undici": "^8.12.3"
  "@executor-js/fumadb>zod": "4.6.7"
  "@executor-js/plugin-mcp>zod": "4.6.7"
  "sharp@<0.35.5": "0.35.5"
  # @capacitor/assets lists @capacitor/cli 5.7.8, whose template extraction expects tar 6's default
  # export; assets never calls it, and the `cap` binary we run is cli 8, already on tar 7.
  "tar@<7.5.22": "7.5.22"
  "uuid@<11.1.1": "11.1.1"
  "@grpc/grpc-js@<1.13.6": "^1.14.6"
  "fflate@<0.4.9": "0.4.9"
patchedDependencies:
  '@earendil-works/pi-ai@1.4.0': patches/@earendil-works__pi-ai@1.4.0.patch
  '@executor-js/sdk@1.5.37': patches/@executor-js__sdk@1.5.37.patch
  playwright-core@1.64.0: patches/playwright-core@1.64.0.patch
